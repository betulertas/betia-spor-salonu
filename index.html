      ${fld(px, 'firstName', 'Ad', `<input id="${px}firstName" name="firstName" type="text" autocomplete="off" value="${esc(m.firstName)}" required>`)}
      ${fld(px, 'lastName', 'Soyad', `<input id="${px}lastName" name="lastName" type="text" autocomplete="off" value="${esc(m.lastName)}" required>`)}
      ${fld(px, 'age', 'Yaş', `<input id="${px}age" name="age" type="text" inputmode="numeric" autocomplete="off" value="${age != null ? age : ''}">`)}
      ${fld(px, 'phone', 'Telefon', `<input id="${px}phone" name="phone" type="tel" inputmode="numeric" autocomplete="off" value="${esc(fmtPhone(m.phone))}" placeholder="5xx xxx xx xx" data-phone>`, 'başında 0 olmadan')}
      ${fld(px, 'goal', 'Hedef', `<select id="${px}goal" name="goal"><option value="">Seç</option>${GOALS.map(g => `<option ${m.goal === g ? 'selected' : ''}>${g}</option>`).join('')}</select>`)}
    </div>
    <fieldset class="field"><legend>Sağlık sorunu var mı?</legend><div class="seg-opts">
      <label for="${px}h-no"><input id="${px}h-no" type="radio" name="health" value="hayir" ${health ? '' : 'checked'}>Hayır</label>
      <label for="${px}h-yes"><input id="${px}h-yes" type="radio" name="health" value="evet" ${health ? 'checked' : ''}>Evet</label>
    </div></fieldset>
    <label class="field" for="${px}healthNote" data-health-note ${health ? '' : 'hidden'}><span>Sağlık sorunu nedir?</span><textarea id="${px}healthNote" name="healthNote" rows="2" placeholder="Örn. bel fıtığı, tansiyon, diz ameliyatı. Antrenmanda buna dikkat edilir.">${esc(m.healthNote)}</textarea></label>
    <div class="grid2">
      ${fld(px, 'emergencyName', 'Acil durumda aranacak kişi', `<input id="${px}emergencyName" name="emergencyName" type="text" autocomplete="off" value="${esc(m.emergencyName)}" placeholder="Ad soyad">`)}
      ${fld(px, 'emergencyRelation', 'Yakınlığı', `<input id="${px}emergencyRelation" name="emergencyRelation" type="text" autocomplete="off" list="${px}rel-list" value="${esc(m.emergencyRelation)}" placeholder="Örn. annesi, eşi"><datalist id="${px}rel-list">${RELATIONS.map(r => `<option value="${r}"></option>`).join('')}</datalist>`)}
      ${fld(px, 'emergencyPhone', 'Acil durum telefonu', `<input id="${px}emergencyPhone" name="emergencyPhone" type="tel" inputmode="numeric" autocomplete="off" value="${esc(fmtPhone(m.emergencyPhone))}" placeholder="5xx xxx xx xx" data-phone>`)}
      ${fld(px, 'note', 'Not', `<input id="${px}note" name="note" type="text" autocomplete="off" value="${esc(m.note)}" placeholder="İsteğe bağlı">`)}
      ${cardFieldHTML(px, m)}
    </div>`;
}
/* Turnike kartı yalnızca okutulur: numara ekranda görünmez. Okuyucu klavye gibi yazar, gizli kutu yakalar. */
function cardFieldHTML(px, m) {
  const has = !!(m && m.cardNo);
  return `<div class="field"><span>Turnike kartı</span><div class="scan" data-scan>
    <input id="${px}cardNo" name="cardNo" class="scan-in" type="text" inputmode="none" autocomplete="off" value="${esc((m && m.cardNo) || '')}" data-card aria-label="Turnike kartı">
    <button type="button" class="btn btn-sm" data-act="scan-start" data-for="${px}cardNo">${has ? 'Kartı değiştir' : 'Kartı okut'}</button>
    <span class="scan-state${has ? ' ok' : ''}" data-scan-state>${has ? 'Kart tanımlı' : 'Kart okutulmadı'}</span>
  </div></div>`;
}
function setScanState(inp, st) {
  const box = inp && inp.closest('[data-scan]');
  if (!box) return;
  const lab = box.querySelector('[data-scan-state]'), btn = box.querySelector('[data-act="scan-start"]');
  lab.className = 'scan-state' + (st === 'ok' ? ' ok' : st === 'wait' ? ' wait' : '');
  lab.textContent = st === 'ok' ? 'Kart okundu' : st === 'wait' ? 'Kartı okuyucuya yaklaştır…' : 'Kart okutulmadı';
  if (btn) btn.textContent = st === 'ok' ? 'Kartı değiştir' : 'Kartı okut';
}
function endScan(inp) {
  if (!inp.value.trim() && inp.dataset.prev) inp.value = inp.dataset.prev;
  delete inp.dataset.prev;
  setScanState(inp, inp.value.trim() ? 'ok' : 'idle');
}
function cardOwner(card, exceptId) {
  const n = normCard(card);
  if (!n) return null;
  return S.members.find(x => x.id !== exceptId && normCard(x.cardNo) === n) || null;
}
const RELATIONS = ['Annesi', 'Babası', 'Eşi', 'Kardeşi', 'Kızı', 'Oğlu', 'Akrabası', 'Arkadaşı'];
function readPhone(v, label, errs) {
  const d = phoneDigits(v);
  if (!d) return '';
  if (d.length !== 10) { errs.push(`${label}: başında 0 olmadan 10 hane yaz (örn. 532 111 22 33).`); return ''; }
  return fmtPhone(d);
}
function readHeight(v, errs) {
  const hV = parseNum(v);
  if (hV === null) return null;
  if (!Number.isFinite(hV) || hV < 90 || hV > 230) { errs.push('Boyu santimetre olarak yaz (örn. 165).'); return null; }
  return round1(hV);
}
function readPerson(form, errs, exceptId, existing) {
  const E = form.elements;
  const g = n => (E[n] ? String(E[n].value || '') : '');
  const firstName = g('firstName').trim(), lastName = g('lastName').trim();
  if (!firstName) errs.push('Adı yaz.');
  if (!lastName) errs.push('Soyadı yaz.');
  const ageV = parseNum(g('age'));
  let birthYear = null;
  if (ageV !== null) {
    if (!Number.isFinite(ageV) || ageV < 5 || ageV > 100) errs.push('Yaş 5 ile 100 arasında olmalı.');
    else {
      const prevAge = existing ? ageOf(existing) : null;
      birthYear = prevAge === Math.round(ageV) && existing.birthYear ? existing.birthYear : new Date().getFullYear() - Math.round(ageV);
    }
  }
  const health = (form.querySelector('[name="health"]:checked') || {}).value === 'evet';
  const out = {
    firstName, lastName, birthYear, phone: readPhone(g('phone'), 'Telefon', errs), goal: g('goal'),
    hasHealthIssue: health, healthNote: health ? g('healthNote').trim() : '',
    emergencyName: g('emergencyName').trim(), emergencyRelation: g('emergencyRelation').trim(),
    emergencyPhone: readPhone(g('emergencyPhone'), 'Acil durum telefonu', errs),
    note: g('note').trim()
  };
  /* Boy artık ölçüm bölümünde, kilonun yanında; o kutu bu formda yoksa eski boy korunur */
  if (E['height']) out.height = readHeight(g('height'), errs);
  if (E['cardNo']) {
    const cardNo = g('cardNo').trim();
    const other = cardOwner(cardNo, exceptId);
    if (other) errs.push(`Bu kart ${fullName(other)} adına tanımlı.`);
    out.cardNo = cardNo;
  }
  return out;
}
function measFieldsHTML(px, values, prevValues, height) {

    return `<label class="field" for="${px}f_${esc(f.k)}"><span>${esc(f.l)} <em>${esc(f.u)}</em></span><input id="${px}f_${esc(f.k)}" name="f_${esc(f.k)}" type="text" inputmode="decimal" autocomplete="off" value="${esc(v)}" placeholder="${esc(pv)}"></label>`;
  });

    cells.splice(i + 1, 0, `<label class="field" for="${px}height"><span>Boy <em>cm</em></span><input id="${px}height" name="height" type="text" inputmode="decimal" autocomplete="off" value="${height ? esc(fmtPlain(height)) : ''}"></label>`);

function updateBmiLive(form) {
  const box = form && form.querySelector('[data-bmi-live]');
  if (!box) return;
  const E = form.elements;
  const w = parseNum(E['f_kilo'] ? E['f_kilo'].value : ''), h = parseNum(E['height'] ? E['height'].value : '');
  const r = w != null && h != null && h >= 90 && h <= 230 && w > 0 && w < 400 ? weightReport(w, h) : null;
  if (!r) { box.textContent = 'Kilo ve boy yazınca vücut kitle indeksi ve ideal kilo burada hesaplanır.'; box.classList.remove('on'); return; }
  box.classList.add('on');
  box.innerHTML = `Vücut kitle indeksi <strong>${fmtNum(r.bmi)}</strong> (${esc(r.cls.l)}) · İdeal kilo <strong>${fmtNum(Math.round(r.min))}–${fmtNum(Math.round(r.max))} kg</strong> · ${r.over > 0 ? `<strong class="t-bad">${fmtNum(r.over)} kg fazla</strong>` : r.under > 0 ? `<strong class="t-bad">${fmtNum(r.under)} kg eksik</strong>` : 'ideal aralıkta'}`;
}
function readMeas(form, errs, ex) {
  const E = form.elements;
  const date = E['mdate'] ? E['mdate'].value : '';
  const values = {};
  const known = new Set(fields().map(f => f.k));
  if (ex && ex.values) for (const k in ex.values) if (!known.has(k)) values[k] = ex.values[k];
  let any = false;
  for (const f of fields()) {
    const el = E['f_' + f.k];
    if (!el) continue;
    const v = parseNum(el.value);
    if (v === null) continue;
    if (!Number.isFinite(v) || v < 0 || v > 999) { errs.push(`${f.l}: geçerli bir sayı yaz.`); continue; }
    values[f.k] = round2(v);
    any = true;
  }
  const note = E['mnote'] ? E['mnote'].value.trim() : '';
  if (!any && !note) return null;
  if (!isYMD(date)) { errs.push('Ölçüm tarihini seç.'); return null; }
  return { id: ex ? ex.id : uid('o'), date, values, note, createdAt: ex && ex.createdAt ? ex.createdAt : new Date().toISOString() };
}

async function submitNew(form) {
  const errs = [];
  const ms = readPkgPay(form, errs);
  const person = readPerson(form, errs, null, null);
  const meas = readMeas(form, errs, null);
  const box = $('#new-errors');
  if (errs.length) {
    box.hidden = false;
    box.innerHTML = `<strong>Kaydetmeden önce şunları düzelt:</strong><ul>${errs.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`;
    box.scrollIntoView({ block: 'center' });
    return;
  }
  box.hidden = true;
  const id = uid('m');
  const now = new Date().toISOString();
  const data = Object.assign(person, { memberships: [ms], measurements: meas ? [meas] : [], checkins: [], createdAt: now, updatedAt: now });
  const btn = form.querySelector('button[type="submit"]');
  btn.disabled = true;
  btnBusy(btn);
  applyLocal(id, data);
  try { await saveMember(id, data); }
  catch (e) { applyLocal(id, null); btnReset(btn); toast(writeErrText(e), 'bad'); return; }
  S.formDirty = false;
  if (!reduceMotion()) { btnDone(btn); await sleep(500); }
  toast(fullName(data) + ' kaydedildi');
  go('uye-' + id);
}

/* Kalan süre: salonun üyelik kartı ve halka göstergesi */
function statusCard(m, s) {
  const t = S.today, id = esc(m.id);
  const logo = LOGO;
  const who = extra => `<div><p class="mcard-name">${esc(fullName(m))}</p><p class="mcard-no">${[m.phone ? esc(fmtPhone(m.phone)) : '', extra].filter(Boolean).join(' · ')}</p></div>`;
  if (s.status === 'yok') {
    return `<section class="status-card tone-idle"><div class="mcard yok"><div class="mcard-l">${logo}<span class="mcard-stamp">Paket yok</span>${who('')}</div>${ringHTML(0, '<strong>0</strong><span>gün</span>', 'mc-' + m.id)}</div>
      <div class="card sc-info"><p class="note idle">Paket eklediğinde kalan gün burada görünür.</p><div><button type="button" class="btn btn-primary" data-act="renew" data-id="${id}">Paket ekle</button></div></div></section>`;
  }
  const f = s.focus;
  let p = 0, inner, stamp, note = '', extra = '';
  if (s.status === 'bitti') {
    stamp = 'Süresi doldu';
    inner = `<strong>${s.daysAgo}</strong><span>gün önce bitti</span>`;
    note = `<p class="note bad">${ICON.alert}<span>Üyelik sona erdi. Turnikede kartını okutursa “Üyeliğin sona erdi” yazar. Yenilemek için “Paket yenile”ye bas.</span></p>`;
  } else if (s.status === 'bekliyor') {
    stamp = 'Başlamadı'; p = 1;
    inner = `<strong>${diffDays(t, f.effStart)}</strong><span>gün sonra başlıyor</span>`;
    note = `<p class="note idle">${fmtDate(f.effStart)} tarihinde başlıyor; ${esc(remainText(s.remaining, f.effStart))} kullanım hakkı var.</p>`;
  } else {
    p = s.total ? s.remaining / s.total : 0;
    inner = `<strong>${s.remaining}</strong><span>gün kaldı</span>`;
    const sp = splitMonths(t, addDays(t, s.remaining));
    if (sp.m) extra = esc(remainText(s.remaining, t)) + ' kaldı';
    if (s.status === 'donduruldu') {
      stamp = `${ICON.snow}Donduruldu`;
      const af = s.cur.activeFreeze;
      note = `<p class="note ice">${ICON.snow}<span>${fmtDate(af.start)} tarihinden beri donduruldu (${diffDays(af.start, t)} gün)${af.end ? `, dönüş ${fmtDate(af.end)}` : ''}. Kalan gün azalmıyor; üye kartını okuttuğunda dondurma kendiliğinden biter.</span></p>`;
    } else if (s.warn) {
      stamp = s.lastDayToday ? 'Bugün son gün' : 'Bitmek üzere';
      note = `<p class="note warn">${ICON.alert}<span>${s.lastDayToday ? 'Bugün üyeliğin son günü.' : `Üyeliğin bitmesine ${s.remaining} gün kaldı.`} Yenileme için ${m.phone ? `<strong>${esc(fmtPhone(m.phone))}</strong> numarasından ` : ''}aranabilir.</span></p>`;
    } else {
      stamp = 'Aktif üye';
      if (s.cur && s.cur.upcomingFreeze) {
        const uf = s.cur.upcomingFreeze;
        note = `<p class="note ice">${ICON.snow}<span>${fmtDate(uf.start)} tarihinde dondurma başlayacak${uf.end ? `, dönüş ${fmtDate(uf.end)}` : ''}.</span></p>`;
      }
    }
  }
  const used = s.status === 'bitti' ? 100 : s.status === 'bekliyor' ? 0 : s.total > 0 ? Math.max(0, Math.min(100, Math.round((1 - s.remaining / s.total) * 100))) : 0;
  const frozenTotal = s.chain.reduce((n, x) => n + x.frozenDays, 0);
  const cls = s.status === 'aktif' && s.warn ? 'warn' : s.status;
  return `<section class="status-card tone-${toneOf(s)}">
    <div class="mcard ${cls}"><div class="mcard-l">${logo}<span class="mcard-stamp">${stamp}</span>${who(extra)}</div>${ringHTML(p, inner, 'mc-' + m.id)}</div>
    <div class="card sc-info">
      <dl class="sc-dates"><div><dt>Başlangıç</dt><dd>${fmtDate(f.effStart)}</dd></div><div><dt>Son gün</dt><dd>${fmtDate(s.lastDay)}</dd></div><div><dt>Paket</dt><dd>${s.chain.map(x => x.months + ' ay').join(' + ')}</dd></div>${frozenTotal ? `<div><dt>Dondurulan</dt><dd>${frozenTotal} gün</dd></div>` : ''}</dl>
      <div class="meter" role="img" aria-label="Sürenin yüzde ${used} kadarı kullanıldı"><span data-anim="mt-${id}" data-w="${used}" style="width:${used}%"></span></div>

/* Ölçümler */
function tabMeasure(m) {
  const list = sortedMeas(m), fl = fieldsForMember(m, cfg().extraFields), id = m.id;
  const addBtn = `<button type="button" class="btn btn-primary" data-act="meas-add" data-id="${esc(id)}">Yeni ölçüm ekle</button>`;
  if (!list.length) {
    return `<section class="card card-pad stack"><h2 class="sec-title">Henüz ölçüm yok</h2><p class="muted">Her ay ölçüleri girdiğinde burada saklanır; istediğin iki ölçümü, örneğin 1. ay ile 6. ayı yan yana karşılaştırabilirsin.</p><div>${addBtn}</div></section>`;
  }
  const st = S.cmp[id] || {};
  let ai = list.findIndex(x => x.id === st.a); if (ai < 0) ai = 0;
  let bi = list.findIndex(x => x.id === st.b); if (bi < 0) bi = list.length - 1;
  const A = list[ai], B = list[bi];
  const opts = sel => list.map((x, i) => `<option value="${esc(x.id)}" ${x.id === sel.id ? 'selected' : ''}>${i + 1}. ölçüm · ${fmtDate(x.date)}</option>`).join('');
  const kgOf = x => numOrNull(x && x.values && x.values.kilo);
  const lastKg = list.slice().reverse().find(x => kgOf(x) != null);
  const firstKg = list.find(x => kgOf(x) != null);
  const wr = lastKg ? weightReport(kgOf(lastKg), m.height) : null;
  const wr0 = firstKg && firstKg !== lastKg ? weightReport(kgOf(firstKg), m.height) : null;
  let bmiBox;
  if (wr) {
    const tone = wr.over > 0 || wr.under > 0 ? ' bad' : '';
    bmiBox = `<section class="card card-pad stack bmi-card">
      <div class="sec-row"><h2 class="sec-title">Vücut kitle indeksi ve ideal kilo</h2><span class="muted sm">${fmtDate(lastKg.date)} ölçümüne göre · ${fmtNum(kgOf(lastKg))} kg, ${fmtNum(m.height)} cm</span></div>
      <div class="stats">
        <div class="stat-box"><small>Vücut kitle indeksi</small><strong>${fmtNum(wr.bmi)}</strong><span class="sm">${esc(wr.cls.l)}${wr0 ? ` · ilk ölçümde ${fmtNum(wr0.bmi)}` : ''}</span></div>
        <div class="stat-box"><small>İdeal kilo</small><strong>${fmtNum(Math.round(wr.min))}–${fmtNum(Math.round(wr.max))} kg</strong><span class="sm">sağlıklı aralık</span></div>
        <div class="stat-box${tone}"><small>${wr.under > 0 ? 'Eksik kilo' : 'Fazla kilo'}</small><strong>${wr.over > 0 ? fmtNum(wr.over) + ' kg' : wr.under > 0 ? fmtNum(wr.under) + ' kg' : 'Yok'}</strong><span class="sm">${wr.over > 0 ? 'ideal kilonun üst sınırına göre' : wr.under > 0 ? 'ideal kilonun alt sınırına göre' : 'ideal aralıkta'}</span></div>
      </div>
      <p class="muted sm">İdeal kilo, Dünya Sağlık Örgütü'nün sağlıklı vücut kitle indeksi aralığına (18,5–24,9) göre hesaplanır. Bilgi amaçlıdır, doktor değerlendirmesinin yerine geçmez.</p>
    </section>`;
  } else {
    bmiBox = `<p class="note idle">${m.height ? 'Vücut kitle indeksi ve ideal kilo, kilo girilen ilk ölçümle hesaplanır.' : 'Vücut kitle indeksi ve ideal kilo için boy gerekli: yeni ölçüm eklerken Kilo’nun yanındaki Boy kutusunu doldur.'}</p>`;
  }
  const bmiRow = (xa, xb) => {
    const va = bmi(kgOf(xa), m.height), vb = bmi(kgOf(xb), m.height);
    return va == null && vb == null ? null : { f: { k: 'vki', l: 'Vücut kitle indeksi', u: '' }, va, vb, diff: va != null && vb != null ? round1(vb - va) : null };
  };
  let cmp;
  if (list.length >= 2) {
    const rows = compareMeas(A, B, fl);
    const br = bmiRow(A, B);
    if (br) rows.splice(rows.findIndex(r => r.f.k === 'kilo') + 1, 0, br);
    const sum = cmpSummary(m, A, B, rows);

      <h2 class="sec-title">Karşılaştırma</h2>
      <div class="cmp-bar">
        <label class="field" for="cmp-a"><span>İlk ölçüm</span><select id="cmp-a" data-change="cmp-a" data-id="${esc(id)}">${opts(A)}</select></label>

  let chart = '';
  if (chartable.length) {

    if (!chartable.some(f => f.k === ck)) ck = chartable.some(f => f.k === 'kilo') ? 'kilo' : chartable[0].k;

        <label class="field inline" for="chart-f"><span class="sr">Grafikte gösterilecek ölçü</span><select id="chart-f" data-change="chart-f" data-id="${esc(id)}">${chartable.map(f => `<option value="${esc(f.k)}" ${f.k === ck ? 'selected' : ''}>${esc(f.l)}</option>`).join('')}</select></label></div>
      <div class="chart" data-chart="${esc(id)}" data-field="${esc(ck)}"></div>
    </section>`;
  }
  const shown = fl.filter(f => list.some(x => numOrNull(x.values && x.values[f.k]) != null));
  const hist = `<section class="card"><div class="card-head"><h2>Tüm ölçümler</h2><span class="muted sm">${list.length} ölçüm · en yenisi vurgulu</span></div><div class="pad"><div class="tbl-wrap"><table class="tbl hist">
    <thead><tr><th>Ölçü</th>${list.map((x, i) => `<th class="r"><span class="hn">${i + 1}. ölçüm</span><span class="hd">${fmtDate(x.date)}</span><span class="hacts"><button type="button" class="link-btn" data-act="meas-edit" data-id="${esc(id)}" data-mid="${esc(x.id)}">Düzenle</button><button type="button" class="link-btn danger" data-act="meas-del" data-id="${esc(id)}" data-mid="${esc(x.id)}">Sil</button></span></th>`).join('')}</tr></thead>
    <tbody>${shown.map(f => `<tr><th scope="row">${esc(f.l)} <small>${esc(f.u)}</small></th>${list.map(x => { const v = numOrNull(x.values && x.values[f.k]); return `<td class="r">${v != null ? fmtNum(v) : '—'}</td>`; }).join('')}</tr>${f.k === 'kilo' && m.height ? `<tr class="bmi-row"><th scope="row">Vücut kitle indeksi</th>${list.map(x => { const v = bmi(kgOf(x), m.height); return `<td class="r">${v != null ? fmtNum(v) : '—'}</td>`; }).join('')}</tr>` : ''}`).join('')}
    ${list.some(x => x.note) ? `<tr><th scope="row">Not</th>${list.map(x => `<td class="note-cell">${esc(x.note || '')}</td>`).join('')}</tr>` : ''}</tbody></table></div></div></section>`;
  return `<div class="stack">
    <div class="sec-row">${addBtn}</div>
    ${bmiBox}${cmp}${chart}${hist}
  </div>`;
}
function deltaHTML(r) {
  if (r.diff == null) return '<span class="delta same">—</span>';
  if (r.diff === 0) return '<span class="delta same">Değişmedi</span>';
  const down = r.diff < 0;
  return `<span class="delta ${down ? 'down' : 'up'}"><span aria-hidden="true">${down ? '▼' : '▲'}</span>${esc(diffPhrase(r.f, r.diff))}</span>`;
}
function cmpSummary(m, A, B, rows) {
  const parts = [];
  const kg = rows.find(r => r.f.k === 'kilo' && r.diff);
  if (kg) parts.push(diffPhrase(kg.f, kg.diff));
  rows.filter(r => r.f.u === 'cm' && r.diff).sort((a, b) => Math.abs(b.diff) - Math.abs(a.diff)).slice(0, 3)
    .forEach(r => parts.push(r.f.l.toLocaleLowerCase('tr-TR') + ' ' + diffPhrase(r.f, r.diff)));
  if (!parts.length) return '';
  let span = '';
  if (B.date > A.date) {
    const sp = splitMonths(A.date, B.date);
    span = sp.m ? (sp.d ? `${sp.m} ay ${sp.d} günde` : `${sp.m} ayda`) : `${sp.d} günde`;
  }
  return `${esc(m.firstName || 'Üye')} ${span ? `<strong>${span}</strong> ` : ''}${esc(parts.join(', '))}.`;
}

/* Girişler */
function frozenOn(s, d, t) {
  return s.calcs.some(c => (c.ms.freezes || []).some(f => f && isYMD(f.start) && f.start <= d && d < (f.end || addDays(t, 1))));

function calendarHTML(m, s, ym, days) {
  const [Y, M] = ym.split('-').map(Number);
  const daysIn = new Date(Date.UTC(Y, M, 0)).getUTCDate();
  const lead = (new Date(Date.UTC(Y, M - 1, 1)).getUTCDay() + 6) % 7;
  const t = S.today;
  let cells = '';
  for (let i = 0; i < lead; i++) cells += '<span class="cal-d blank" aria-hidden="true"></span>';
  for (let d = 1; d <= daysIn; d++) {
    const ds = `${Y}-${pad2(M)}-${pad2(d)}`;
    const came = days.has(ds);
    const fz = !came && frozenOn(s, ds, t);
    const cov = s.calcs.some(c => c.effStart <= ds && ds < c.end);
    const cls = ['cal-d'];
    if (came) cls.push('in'); else if (fz) cls.push('frz'); else if (!cov) cls.push('out');
    if (ds === t) cls.push('today');
    const word = came ? 'geldi' : fz ? 'dondurulmuş' : !cov ? 'üyelik dışı' : ds > t ? '' : 'gelmedi';
    cells += `<span class="${cls.join(' ')}" title="${fmtDate(ds)}${word ? ': ' + word : ''}">${d}</span>`;
  }
  return `<div class="cal"><div class="cal-head"><button type="button" class="icon-btn" data-act="cal" data-id="${esc(m.id)}" data-dir="-1" aria-label="Önceki ay">‹</button><strong>${fmtMonthYear(ym + '-01')}</strong><button type="button" class="icon-btn" data-act="cal" data-id="${esc(m.id)}" data-dir="1" aria-label="Sonraki ay">›</button></div>
    <div class="cal-grid">${['Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt', 'Paz'].map(x => `<span class="cal-dow">${x}</span>`).join('')}${cells}</div>

}

/* ---------- Grafik ---------- */
const chartData = new WeakMap();
function niceStep(range, target) {
  const raw = range / target;
  const p = Math.pow(10, Math.floor(Math.log10(raw)));
  const n = raw / p;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p;
}
function drawCharts() {
  $$('[data-chart]').forEach(host => {
    const m = S.byId.get(host.dataset.chart);
    const f = m && fieldsForMember(m, cfg().extraFields).find(x => x.k === host.dataset.field);
    if (!m || !f) return;
    const pts = sortedMeas(m).map(x => ({ date: x.date, v: numOrNull(x.values && x.values[f.k]) })).filter(p => p.v != null);
    if (pts.length < 2) { host.innerHTML = '<p class="muted">Grafik için en az iki ölçüm gerekli.</p>'; return; }
    const W = Math.max(280, Math.floor(host.clientWidth || 600)), H = 230;
    const P = { l: 46, r: 16, t: 26, b: 30 };
    let lo = Math.min.apply(null, pts.map(p => p.v)), hi = Math.max.apply(null, pts.map(p => p.v));
    if (hi - lo < 1e-9) { lo -= 1; hi += 1; }
    const step = niceStep(hi - lo, 4);
    lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
    if (hi <= lo) hi = lo + step;
    const t0 = utcOf(pts[0].date), t1 = utcOf(pts[pts.length - 1].date);
    const iw = W - P.l - P.r, ih = H - P.t - P.b;
    const X = d => P.l + (t1 === t0 ? iw / 2 : ((utcOf(d) - t0) / (t1 - t0)) * iw);
    const Y = v => P.t + (1 - (v - lo) / (hi - lo)) * ih;
    const pp = pts.map(p => ({ date: p.date, v: p.v, x: X(p.date), y: Y(p.v) }));
    let grid = '';
    for (let v = lo; v <= hi + step / 2; v += step) {
      const y = Y(v).toFixed(1);
      grid += `<line class="ch-grid" x1="${P.l}" x2="${W - P.r}" y1="${y}" y2="${y}"/><text class="ch-axis" x="${P.l - 8}" y="${(+y + 4).toFixed(1)}" text-anchor="end">${fmtNum(round2(v), 1)}</text>`;
    }
    let xl = '', lastX = -Infinity;
    const endX = pp[pp.length - 1].x;
    pp.forEach((p, i) => {
      const isEnd = i === 0 || i === pp.length - 1;
      if (isEnd || (p.x - lastX >= 72 && endX - p.x >= 72)) {
        xl += `<text class="ch-axis" x="${p.x.toFixed(1)}" y="${H - 8}" text-anchor="${i === 0 ? 'start' : i === pp.length - 1 ? 'end' : 'middle'}">${fmtDM(p.date)}</text>`;
        lastX = p.x;
      }
    });
    const line = pp.map((p, i) => (i ? 'L' : 'M') + p.x.toFixed(1) + ' ' + p.y.toFixed(1)).join(' ');
    const base = (P.t + ih).toFixed(1);
    const area = `${line} L${endX.toFixed(1)} ${base} L${pp[0].x.toFixed(1)} ${base} Z`;
    const dots = pp.map((p, i) => `<circle class="ch-dot" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${i === pp.length - 1 ? 5.5 : 4}"/>`).join('');
    const a = pp[0], z = pp[pp.length - 1];
    const labels = `<text class="ch-val" x="${a.x.toFixed(1)}" y="${(a.y - 12).toFixed(1)}" text-anchor="start">${fmtNum(a.v)}</text><text class="ch-val" x="${z.x.toFixed(1)}" y="${(z.y - 12).toFixed(1)}" text-anchor="end">${fmtNum(z.v)}${f.u ? ' ' + esc(f.u) : ''}</text>`;
    host.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(f.l)}: ilk ölçüm ${fmtNum(a.v)}, son ölçüm ${fmtNum(z.v)} ${esc(f.u)}">${grid}<path class="ch-area" d="${area}"/><path class="ch-line" d="${line}"/><line class="ch-cross" x1="0" x2="0" y1="${P.t}" y2="${base}" opacity="0"/>${dots}<circle class="ch-hl" r="7" cx="0" cy="0" opacity="0"/>${labels}${xl}</svg><div class="ch-tip" hidden></div>`;
    chartData.set(host, { pts: pp, unit: f.u });
    host.onpointermove = e => chartHover(host, e);
    host.onpointerdown = e => chartHover(host, e);
    host.onpointerleave = () => chartHide(host);
  });
}
function chartHover(host, e) {
  const d = chartData.get(host);
  if (!d) return;
  const rect = host.getBoundingClientRect();
  const x = e.clientX - rect.left;
  let best = d.pts[0];
  for (const p of d.pts) if (Math.abs(p.x - x) < Math.abs(best.x - x)) best = p;
  const cross = host.querySelector('.ch-cross'), hl = host.querySelector('.ch-hl'), tip = host.querySelector('.ch-tip');
  cross.setAttribute('x1', best.x); cross.setAttribute('x2', best.x); cross.setAttribute('opacity', '1');
  hl.setAttribute('cx', best.x); hl.setAttribute('cy', best.y); hl.setAttribute('opacity', '1');
  tip.innerHTML = `<span>${fmtDate(best.date)}</span><strong>${fmtNum(best.v)}${d.unit ? ' ' + esc(d.unit) : ''}</strong>`;
  tip.hidden = false;
  tip.style.left = Math.max(70, Math.min(rect.width - 70, best.x)) + 'px';
  tip.style.top = best.y + 'px';
}
function chartHide(host) {
  const cross = host.querySelector('.ch-cross'), hl = host.querySelector('.ch-hl'), tip = host.querySelector('.ch-tip');
  if (cross) cross.setAttribute('opacity', '0');
  if (hl) hl.setAttribute('opacity', '0');
  if (tip) tip.hidden = true;
}

async function submitSettings(form) {
  const E = form.elements, errs = [];
  const warn = parseNum(E['warnDays'].value);
  if (warn === null || !Number.isFinite(warn) || warn < 0 || warn > 60) errs.push('Uyarı günü 0 ile 60 arasında olmalı.');
  const prices = {};
  for (const m of PACKAGES) {
    const v = parseNum(E['price' + m].value);
    if (v === null) prices[m] = '';
    else if (!Number.isFinite(v) || v < 0) errs.push(`${m} aylık paketin fiyatı geçersiz.`);
    else prices[m] = round2(v);
  }
  const pin = E['kioskPin'].value.trim();
  if (pin && !/^\d{3,8}$/.test(pin)) errs.push('Çıkış şifresi 3 ile 8 haneli bir sayı olmalı.');
  const box = $('#settings-errors');
  if (errs.length) { box.hidden = false; box.innerHTML = `<ul>${errs.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`; return; }
  box.hidden = true;
  const doc = { gymName: E['gymName'].value.trim().slice(0, 60), warnDays: Math.round(warn), prices, kioskPin: pin, extraFields: S.extraDraft.slice(), updatedAt: new Date().toISOString() };
  const btn = form.querySelector('button[type="submit"]');
  btn.disabled = true;
  btnBusy(btn);
  try {
    await saveSettings(doc);
    S.settingsDoc = doc;
    S.formDirty = false;
    btnDone(btn);
    toast('Ayarlar kaydedildi');
    onSettings();
    setTimeout(() => btnReset(btn), 1400);
  } catch (e) { btnReset(btn); toast(writeErrText(e), 'bad'); }
}
function addExtraField() {

function delMeas(id, mid) {
  const m = getM(id); if (!m) return;
  const x = (m.measurements || []).find(y => y.id === mid); if (!x) return;
  confirmModal({ title: 'Ölçümü sil', ok: 'Sil', danger: true, text: `${fmtDate(x.date)} tarihli ölçüm silinsin mi?`,
    run: () => mutateMember(id, d => { d.measurements = (d.measurements || []).filter(y => y.id !== mid); }) });
}
/* Turnike kartını üyeye bağlar: kart okuyucuya okutulur, okuyucunun Enter'ı kaydeder */
function modalCard(id) {
  const m = getM(id); if (!m) return;
  openModal({
    title: m.cardNo ? 'Kartı değiştir' : 'Kartı tanımla', ok: 'Kaydet', focus: '#m-card', done: 'Tanımlandı',
    body: `<p class="muted">${esc(fullName(m))} için turnike kartını okuyucuya okut.</p>
      <div class="scan-wait" data-act="scan-focus"><span class="k-dot" aria-hidden="true"></span><span>Kartı okuyucuya yaklaştır…</span></div>
      <input id="m-card" name="card" class="scan-in" type="text" inputmode="none" autocomplete="off" aria-label="Turnike kartı">`,
    onSubmit: async form => {
      const inp = form.elements['card'];
      const v = inp.value.trim();
      const again = msg => { inp.value = ''; inp.focus(); return modalErrors([msg]); };
      if (!normCard(v)) return again('Kart okunmadı. Kartı okuyucuya tekrar yaklaştır.');
      const other = cardOwner(v, id);
      if (other) return again(`Bu kart ${fullName(other)} adına tanımlı.`);
      const ok = await mutateMember(id, d => { d.cardNo = v; });
      if (ok) toast('Kart tanımlandı');
      return ok;
    }
  });
}
function modalPerson(id) {
  const m = getM(id); if (!m) return;
  openModal({
    title: 'Bilgileri düzenle', wide: true, ok: 'Kaydet',
    body: personFieldsHTML('e-', m),
    onSubmit: async form => {
      const errs = [];
      const person = readPerson(form, errs, id, getM(id));
      if (errs.length) return modalErrors(errs);
      const ok = await mutateMember(id, d => { Object.assign(d, person); });
      if (ok) toast('Bilgiler güncellendi');
      return ok;
    }
  });
}
function delMember(id) {
  const m = getM(id); if (!m) return;
  confirmModal({ title: 'Üyeyi sil', ok: 'Üyeyi sil', danger: true,
    text: `<strong>${esc(fullName(m))}</strong> ve bütün kayıtları (paketler, ödemeler, ölçümler, girişler) silinecek. Bu geri alınamaz.`,
    run: async () => { const ok = await removeMember(id); if (ok) { toast(fullName(m) + ' silindi'); go('uyeler'); } return ok; } });
}
function delSamples() {
  const ids = S.members.filter(m => m.sample).map(m => m.id);
  if (!ids.length) return;
  confirmModal({ title: 'Örnek üyeleri sil', ok: 'Örnekleri sil', danger: true,
    text: `${ids.length} örnek üye ve kayıtları silinecek. Senin eklediğin üyelere dokunulmaz.`,
    run: async () => {
      let n = 0;
      for (const id of ids) if (await removeMember(id)) n++;
      toast(n + ' örnek üye silindi');
      return true;
    } });
}

/* ---------- Turnike ---------- */
const finePointer = () => { try { return window.matchMedia('(pointer: fine)').matches; } catch (e) { return true; } };
function focusKiosk() { const i = $('#k-input'); if (i && S.kiosk && !modalOpen()) { try { i.focus({ preventScroll: true }); } catch (e) { i.focus(); } } }
function enterKiosk() {
  S.kiosk = true;
  $('#toasts').innerHTML = '';
  document.body.classList.add('kiosk-on');
  $('#app').hidden = true;
  $('#kiosk').hidden = false;
  $('#k-gym').textContent = cfg().gymName || 'Betia';
  kioskIdle();
  tick();
  focusKiosk();
}
function exitKiosk() {
  S.kiosk = false;
  clearTimeout(S.kTimer);
  document.body.classList.remove('kiosk-on');
  $('#kiosk').hidden = true;
  $('#app').hidden = false;
  try { if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {}); } catch (e) { /* yok say */ }
  go('ozet');
}
function kioskExitAsk() {
  const pin = cfg().kioskPin;
  if (!pin) { exitKiosk(); return; }
  openModal({
    title: 'Turnike ekranından çık', ok: 'Çık', done: '',
    body: fld('m-', 'pin', 'Çıkış şifresi', '<input id="m-pin" name="pin" type="password" inputmode="numeric" autocomplete="off">'),
    onSubmit: async form => {
      if (form.elements['pin'].value.trim() === pin) { setTimeout(exitKiosk, 0); return true; }
      form.elements['pin'].value = '';
      return modalErrors(['Şifre yanlış.']);
    }
  });
}
function kioskIdle() {
  $('#k-stage').innerHTML = '<div class="k-idle"><div class="k-mark">' + LOGO + '<span class="brand-sub">SPOR SALONU</span></div><h1>Kartını okut</h1><p><span class="k-dot" aria-hidden="true"></span>Kartını okuyucuya yaklaştır</p></div>';
}
function kioskShow(o) {
  $('#k-stage').innerHTML = `<div class="k-res tone-${o.tone}">
    ${o.hello ? `<p class="k-hello">${o.hello}</p>` : ''}
    ${o.ring ? ringHTML(o.ring.p, `<strong>${o.ring.n}</strong><span>${o.ring.unit}</span>`, 'k') : `<div class="k-badge">${ICON[o.icon] || ICON.check}</div>`}
    ${o.title ? `<p class="k-title">${o.title}</p>` : ''}
    ${o.sub ? `<p class="k-sub">${o.sub}</p>` : ''}
    ${(o.msgs || []).map(x => `<p class="k-msg${x.hl ? ' hl' : ''}">${x.t}</p>`).join('')}
  </div>`;
  animateIn($('#k-stage'), null, true);
  clearTimeout(S.kTimer);
  S.kTimer = setTimeout(kioskIdle, o.tone === 'good' ? 6000 : 9000);
}
/* Turnikede yalnızca ad ve kalan süre gösterilir: kilo, ölçü, sağlık ve ödeme bilgisi bu ekrana hiç yazılmaz. */
function kioskScan(raw) {
  const code = normCard(raw);
  if (!code) return;
  if (S.dbState !== 'ready') { kioskShow({ tone: 'ice', icon: 'clock', title: 'Bir saniye', msgs: [{ t: 'Sistem hazırlanıyor. Kartını birkaç saniye sonra tekrar okut.' }] }); return; }
  const m = S.members.find(x => normCard(x.cardNo) === code);
  if (!m) { kioskShow({ tone: 'bad', icon: 'x', title: 'Kart tanınmadı', msgs: [{ t: 'Lütfen hocana başvur.' }] }); return; }
  kioskCheckin(m);
}
function kioskCheckin(m) {
  if (!m) return;
  const r = doCheckin(m, new Date(), cfg().warnDays);
  const first = esc(m.firstName || '');
  const s = r.s;
  if (r.kind === 'expired') { kioskShow({ tone: 'bad', icon: 'x', hello: `Merhaba, <strong>${first}</strong>`, title: 'Üyeliğin sona erdi', msgs: [{ t: `Son gün: ${fmtDate(s.lastDay)}. Yenilemek için hocanla görüşebilirsin.` }] }); return; }
  if (r.kind === 'notstarted') { kioskShow({ tone: 'ice', icon: 'clock', hello: `Merhaba, <strong>${first}</strong>`, title: 'Üyeliğin henüz başlamadı', msgs: [{ t: `Başlangıç: ${fmtDate(s.focus.effStart)}.` }] }); return; }
  if (r.kind === 'nopackage') { kioskShow({ tone: 'bad', icon: 'alert', hello: `Merhaba, <strong>${first}</strong>`, title: 'Aktif paketin yok', msgs: [{ t: 'Lütfen hocanla görüş.' }] }); return; }
  if (r.data) {
    const patch = diffPatch(m, r.data);
    r.data.updatedAt = patch.updatedAt = new Date().toISOString();
    applyLocal(m.id, r.data);
    patchMember(m.id, patch).catch(() => toast('Giriş kaydedilemedi, bağlantıyı kontrol et.', 'bad'));
  }
  const t = S.today;
  const sp = splitMonths(t, addDays(t, s.remaining));
  const msgs = [];
  if (r.kind === 'unfrozen') msgs.push({ t: 'Dondurman bitti, üyeliğin kaldığı yerden devam ediyor.', hl: !s.warn });
  if (s.warn) msgs.push({ t: s.lastDayToday ? 'Bugün üyeliğinin son günü. Yenilemek için hocanla konuşabilirsin.' : `Üyeliğinin bitmesine ${s.remaining} gün kaldı. Yenilemek için hocanla konuşabilirsin.`, hl: true });
  msgs.push({ t: r.kind === 'again' ? 'Bugünkü girişin zaten kayıtlı. İyi antrenmanlar!' : 'İyi antrenmanlar!' });
  kioskShow({
    tone: s.warn ? 'warn' : 'good',
    hello: `${r.kind === 'unfrozen' ? 'Tekrar hoş geldin' : 'Hoş geldin'}, <strong>${first}</strong>`,
    ring: { p: s.total ? s.remaining / s.total : 0, n: s.remaining, unit: s.lastDayToday ? 'son gün' : 'gün kaldı' },
    sub: sp.m && !s.lastDayToday ? esc(remainText(s.remaining, t)) + ' kaldı' : '',
    msgs
  });
}
function tick() {
  const now = new Date();
  const t = todayStr(now);
  if (t !== S.today) { S.today = t; rowsCache = null; onData(); }
  if (S.kiosk) { $('#k-time').textContent = hmLocal(now); $('#k-date').textContent = fmtDayMonthWeekday(t); }
}

/* ---------- Olaylar ---------- */
const ACTIONS = {
  'open': el => go('uye-' + el.dataset.id),
  'goto-filter': el => { S.filter = el.dataset.f; S.q = ''; if (S.route.view === 'uyeler') renderMain(); else go('uyeler'); },
  'filter': el => { S.filter = el.dataset.f; $$('.chip').forEach(c => { const on = c.dataset.f === S.filter; c.classList.toggle('on', on); c.setAttribute('aria-pressed', on); }); renderRows(); },
  'tab': el => { S.tab[el.dataset.id] = el.dataset.tab; renderMain(); const b = $('#tab-' + el.dataset.tab); if (b) b.focus(); },
  'kiosk-open': () => {
    try { const p = document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); if (p && p.catch) p.catch(() => {}); } catch (e) { /* tam ekran izni yok */ }
    go('turnike');
  },
  'kiosk-exit': () => kioskExitAsk(),
  'modal-close': () => closeModal(),
  'checkin-add': el => modalCheckin(el.dataset.id),
  'checkin-del': el => delCheckin(el.dataset.id, el.dataset.ci),
  'freeze': el => modalFreeze(el.dataset.id),
  'freeze-end': el => endFreeze(el.dataset.id),
  'freeze-del': el => delFreeze(el.dataset.id, el.dataset.ms, el.dataset.fid),
  'renew': el => modalRenew(el.dataset.id),
  'ms-edit': el => modalMsEdit(el.dataset.id, el.dataset.ms),
  'ms-del': el => delMs(el.dataset.id, el.dataset.ms),
  'inst-pay': el => modalInstPay(el.dataset.id, el.dataset.ms, el.dataset.ins),
  'inst-unpay': el => instUnpay(el.dataset.id, el.dataset.ms, el.dataset.ins),
  'inst-edit': el => modalInstEdit(el.dataset.id, el.dataset.ms, el.dataset.ins),
  'inst-add': el => modalInstEdit(el.dataset.id, el.dataset.ms, null),
  'inst-fit': async el => {
    const id = el.dataset.id, msId = el.dataset.ms;
    const ok = await mutateMember(id, d => { const x = findMs(d, msId); if (!x) return false; x.installments = respreadInstallments(x, Number(x.price) || 0, S.today); });
    if (ok) toast('Taksitler ücrete göre ayarlandı');
  },
  'inst-del': el => delIns(el.dataset.id, el.dataset.ms, el.dataset.ins),
  'meas-add': el => modalMeas(el.dataset.id, null),
  'meas-edit': el => modalMeas(el.dataset.id, el.dataset.mid),
  'meas-del': el => delMeas(el.dataset.id, el.dataset.mid),
  'edit-person': el => modalPerson(el.dataset.id),
  'card-set': el => modalCard(el.dataset.id),
  'scan-start': el => { const inp = document.getElementById(el.dataset.for); if (!inp) return; inp.dataset.prev = inp.value; inp.value = ''; setScanState(inp, 'wait'); inp.focus(); },
  'scan-focus': () => { const inp = $('#m-card'); if (inp) inp.focus(); },
  'del-member': el => delMember(el.dataset.id),
  'del-samples': () => delSamples(),
  'cal': el => { const id = el.dataset.id; const cur = S.cal[id] || S.today.slice(0, 7); S.cal[id] = addMonths(cur + '-01', Number(el.dataset.dir)).slice(0, 7); renderMain(); },
  'field-add': () => addExtraField(),
  'backup-dl': () => downloadBackup(),
  'backup-up': () => { const f = $('#backup-file'); if (f) { f.value = ''; f.click(); } },
  'field-del': el => { S.extraDraft = S.extraDraft.filter(f => f.k !== el.dataset.k); $('#extra-list').innerHTML = extraFieldsHTML(S.extraDraft); S.formDirty = true; }
};
const CHANGES = {
  'cmp-a': el => { const id = el.dataset.id; S.cmp[id] = Object.assign({}, S.cmp[id], { a: el.value }); renderMain(); },
  'cmp-b': el => { const id = el.dataset.id; S.cmp[id] = Object.assign({}, S.cmp[id], { b: el.value }); renderMain(); },
  'chart-f': el => { S.chartField[el.dataset.id] = el.value; renderMain(); },
  'sort': el => { S.sort = el.value; renderRows(); },
  'backup-file': el => { const f = el.files && el.files[0]; if (f) restoreFromFile(f); }
};

document.addEventListener('click', e => {
  const back = e.target.classList && e.target.classList.contains('modal-back');
  if (back) { closeModal(); return; }
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const h = ACTIONS[el.dataset.act];
  if (h) h(el, e);
  if (S.kiosk && !modalOpen() && !el.closest('.modal')) focusKiosk();
});
function onFormChange(el, isInput) {
  const form = el.closest('form');
  if (!form) return;
  if (form.matches('[data-pkgpay]')) {
    const n = el.name;
    if (!isInput || n === 'price' || /^ia\d+$/.test(n)) {
      if (n === 'price') form.dataset.priceTouched = '1';
      const src = n === 'months' ? 'months' : /^ia\d+$/.test(n) ? 'amount' : /^id\d+$/.test(n) ? 'due' : ['price', 'start', 'count', 'payType'].indexOf(n) >= 0 ? n : 'other';
      updatePkgPay(form, src);
    }
  }
  if (el.name === 'health') { const box = form.querySelector('[data-health-note]'); if (box) box.hidden = el.value !== 'evet'; }
  if (form.id === 'new-form' || form.id === 'settings-form') S.formDirty = true;
}
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset && el.dataset.change && CHANGES[el.dataset.change]) { CHANGES[el.dataset.change](el); return; }
  onFormChange(el, false);
});
function formatPhoneInput(el) {
  const raw = el.value;
  const pos = el.selectionStart == null ? raw.length : el.selectionStart;
  const all = raw.replace(/\D/g, '');
  const kept = phoneDigits(raw);
  const d = kept.slice(0, 10);
  let k = Math.max(0, raw.slice(0, pos).replace(/\D/g, '').length - (all.length - kept.length));
  k = Math.min(k, d.length);
  const out = fmtPhone(d);
  if (out === raw) return;
  let p = 0, seen = 0;
  while (p < out.length && seen < k) { if (/\d/.test(out[p])) seen++; p++; }
  el.value = out;
  if (document.activeElement === el) { try { el.setSelectionRange(p, p); } catch (err) { /* desteklenmiyor */ } }
}
document.addEventListener('focusout', e => {
  const el = e.target;
  if (el && el.matches && el.matches('[data-card]') && el.closest('[data-scan]')) endScan(el);
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.matches && el.matches('[data-phone]')) formatPhoneInput(el);
  if (el.name === 'f_kilo' || el.name === 'height') updateBmiLive(el.closest('form'));
  if (el.id === 'q') { S.q = el.value; renderRows(); return; }
  if (el.id === 'k-input') return;
  onFormChange(el, true);
});
document.addEventListener('submit', async e => {
  const form = e.target;
  e.preventDefault();
  if (form.id === 'k-form') { const inp = $('#k-input'); const v = inp.value; inp.value = ''; kioskScan(v); return; }
  if (form.id === 'new-form') { submitNew(form); return; }
  if (form.id === 'settings-form') { submitSettings(form); return; }
  if (form.id === 'modal-form' && modalSubmit) {
    const btn = form.querySelector('button[type="submit"]');
    if (btn) { btn.disabled = true; btnBusy(btn, 'Bekle'); }
    const doneText = S.modalDone;
    let ok = false;
    try { ok = await modalSubmit(form); }
    catch (err) { console.error(err); modalErrors([writeErrText(err)]); }
    if (ok) {
      if (doneText && btn && document.contains(btn) && !reduceMotion()) { btnDone(btn, doneText); await sleep(480); }
      if ($('#modal-form') === form) closeModal();
    } else if (btn && document.contains(btn)) btnReset(btn);
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && modalOpen()) { closeModal(); return; }
  const el = e.target;
  if (e.key === 'Enter' && el && el.matches && el.matches('[data-card]')) {
    e.preventDefault();
    endScan(el);
    const form = el.closest('form');
    const all = form ? Array.from(form.elements).filter(x => !x.disabled && x.type !== 'hidden' && x.offsetParent !== null) : [];
    const nx = all[all.indexOf(el) + 1];
    if (nx) nx.focus();
    return;
  }
  if (e.key === 'Enter' && el && el.id === 's-newFieldL') { e.preventDefault(); addExtraField(); return; }
  if (S.kiosk && !modalOpen()) {
    const inp = $('#k-input');
    if (document.activeElement !== inp && e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) inp.focus();
  }
}, true);
$('#k-input').addEventListener('blur', () => {
  if (!S.kiosk || !finePointer()) return;
  setTimeout(() => { if (S.kiosk && !modalOpen() && document.activeElement && document.activeElement.tagName !== 'BUTTON') focusKiosk(); }, 80);
});
let resizeT;
window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (!S.kiosk && S.route.view === 'uye') drawCharts(); }, 150); });
setInterval(tick, 15000);

/* ---------- Başlat ---------- */
S.route = routeOf(location.hash);
if (S.route.view === 'turnike') enterKiosk(); else renderAll();
initData();
})();

</script>
