<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Betia Üye Takibi</title>
<meta name="theme-color" content="#FFFEF2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Belleza&amp;family=Inter:wght@400..600&amp;display=swap" rel="stylesheet">
<style>
:root {
  /* Betia: sakin, düz ve tek renkli. Krem zemin, kömür grisi yazı ve düğmeler, köşesiz yüzeyler, ince çizgiler.
     Renk yalnızca dikkat isteyen durumlarda (süresi bitiyor, ödeme gecikti, sağlık notu) tek bir soluk kahverengi. */
  --bg: #FFFEF2;
  --panel: #F6F5E8;
  --panel-2: #EEEDDF;
  --line: #DEDBCB;
  --line-2: #C9C6B4;
  --ink: #333333;
  --ink-2: #4F4F4C;
  --ink-3: #6E6D66;
  --ink-4: #8F8D83;
  --track: #E5E2D2;
  --dark: #333333;
  --dark-2: #1F1F1F;
  --on-dark: #FFFEF2;
  --accent: #945C26;
  --serif: "Belleza", "Optima", "Candara", "Segoe UI", sans-serif;
  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --ease: cubic-bezier(.25, .8, .25, 1);
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; border-radius: 0; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14.5px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
body.kiosk-on { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--ink); text-underline-offset: 3px; }
h1, h2, h3 { margin: 0; font-family: var(--serif); font-weight: 400; text-wrap: balance; }
p { margin: 0; }
:focus-visible { outline: 1px solid var(--ink); outline-offset: 3px; }
[hidden] { display: none !important; }
::selection { background: #E5E2D2; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ico { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.num, .tbl td, .sc-dates dd { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); }
.sm { font-size: 13px; }
.ink { color: var(--ink); }
.t-bad, .t-warn { color: var(--accent); }
.nw { white-space: nowrap; }
.tone-good { --tone: var(--dark); --tone-text: var(--ink); }
.tone-warn, .tone-bad { --tone: var(--accent); --tone-text: var(--accent); }
.tone-ice { --tone: var(--ink-4); --tone-text: var(--ink-3); }
.tone-idle { --tone: var(--line-2); --tone-text: var(--ink-3); }
/* Avatar, renkli rozet ve süs simgeleri yok: sade liste */
.avatar, .stat-ic, .side .nav .ico, .note .ico, .health .ico { display: none !important; }

/* Logo: yalnızca yazı */
.logo { font-family: var(--serif); font-size: 34px; line-height: 1; letter-spacing: .01em; color: var(--ink); white-space: nowrap; }
.brand { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; padding: 4px 0 0 12px; text-decoration: none; }
.brand-sub { font-size: 10px; font-weight: 500; letter-spacing: .32em; color: var(--ink-3); }

/* Kabuk */
#app { display: grid; grid-template-columns: 228px minmax(0, 1fr); min-height: 100%; background: linear-gradient(90deg, transparent 227px, var(--line) 227px 228px, transparent 228px); }
.side { position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; gap: 40px; padding: 34px 16px 22px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; align-items: baseline; gap: 10px; padding: 8px 12px; color: var(--ink-3); font-size: 15px; text-decoration: none; transition: color .2s; }
.nav a:hover { color: var(--ink); }
.nav a.on { color: var(--ink); }
.nav a.on span:first-of-type { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 6px; }
.nav-n { margin-left: auto; font-style: normal; font-size: 12px; color: var(--ink-4); }
.nav-n:empty { display: none; }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 14px; }
.kiosk-btn { width: 100%; }
.side-note { font-size: 11.5px; color: var(--ink-4); padding-left: 12px; }
.maincol { min-width: 0; }
.mtop, .tabbar { display: none; }
main { width: 100%; max-width: 1220px; margin: 0 auto; padding: 40px clamp(16px, 3.2vw, 48px) 96px; }
main:focus { outline: none; }
.banner { width: min(1140px, calc(100% - 32px)); margin: 16px auto 0; padding: 10px 14px; border: 1px solid var(--line-2); color: var(--accent); }
.banner.bad { border-color: var(--accent); }
@media (max-width: 900px) {
  #app { grid-template-columns: minmax(0, 1fr); background: none; }
  .side { display: none; }
  .mtop { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; background: rgba(255, 254, 242, .94); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .mtop-logo { text-decoration: none; display: flex; }
  .mtop .logo { font-size: 26px; }
  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); background: rgba(255, 254, 242, .96); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-top: 1px solid var(--line); }
  .tabbar a { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 4px; color: var(--ink-4); font-size: 11px; text-decoration: none; transition: color .2s; }
  .tabbar a .ico { width: 21px; height: 21px; }
  .tabbar a.on { color: var(--ink); }
  main { padding: 26px 16px 110px; }
}

/* Başlık, düğme, yüzey */
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 28px; }
.page-head h1 { font-size: clamp(32px, 3.6vw, 42px); line-height: 1.1; }
.sub { margin-top: 8px; color: var(--ink-3); font-size: 15px; max-width: 70ch; }
.head-actions, .btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
.btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 9px 20px; border: 1px solid var(--dark); background: transparent; color: var(--ink); font-size: 13.5px; font-weight: 500; letter-spacing: .02em; cursor: pointer; text-decoration: none; white-space: nowrap; transition: background .2s, color .2s, border-color .2s, transform .15s; }
.btn .ico { display: none; }
.btn.is-done .ico { display: block; }
.btn:hover { background: var(--panel-2); }
.btn:active { transform: scale(.98); }
.btn-primary { background: var(--dark); color: var(--on-dark); }
.btn-primary:hover { background: var(--dark-2); }
.btn-danger { color: var(--accent); border-color: var(--accent); }
.btn-danger:hover { background: #F3EBDD; }
.btn-danger-solid { background: var(--accent); border-color: var(--accent); color: var(--on-dark); }
.btn-danger-solid:hover { background: #7A4A1E; }
.btn-ghost { border-color: transparent; }
.btn-ghost:hover { background: var(--panel-2); }
.btn-sm { min-height: 34px; padding: 5px 14px; font-size: 13px; }
.btn[disabled] { opacity: .4; cursor: not-allowed; transform: none; }
.btn.is-busy { pointer-events: none; }
.btn.is-done { background: var(--dark); border-color: var(--dark); color: var(--on-dark); }
.btn.is-done .ico { animation: tick .3s var(--ease); }
.spin { width: 14px; height: 14px; border-radius: 50% !important; border: 1.5px solid currentColor; border-right-color: transparent; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes tick { from { transform: scale(.4); opacity: 0; } to { transform: none; opacity: 1; } }
.icon-btn { width: 36px; height: 36px; border: 0; background: transparent; cursor: pointer; display: inline-grid; place-items: center; color: var(--ink-3); font-size: 22px; line-height: 1; flex: none; transition: color .2s, background .2s; }
.icon-btn:hover { color: var(--ink); background: var(--panel-2); }
.icon-btn.sm { width: 30px; height: 30px; }
.link-btn { border: 0; background: none; padding: 0; color: var(--ink); cursor: pointer; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
.link-btn:hover { color: var(--dark-2); }
.link-btn.danger { color: var(--accent); }
.back { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-3); text-decoration: none; font-size: 13.5px; margin-bottom: 18px; }
.back .ico { width: 15px; height: 15px; }
.back:hover { color: var(--ink); }
.card { background: var(--panel); }
.card-pad { padding: 26px 28px; }
.pad { padding: 16px 28px 26px; }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 6px 14px; padding: 24px 28px 0; flex-wrap: wrap; }
.card-head h2, .sec-title { font-family: var(--serif); font-weight: 400; font-size: 23px; line-height: 1.25; }
.sec-row { display: flex; align-items: center; justify-content: space-between; gap: 10px 16px; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 20px; }
.pill { display: inline-flex; align-items: center; padding: 0; background: none; font-size: 11px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; color: var(--ink-3); }
.pill.warn, .pill.bad { color: var(--accent); }
.m-pills .pill + .pill, .m-pills .pill + .tag-sample { padding-left: 12px; border-left: 1px solid var(--line-2); }
.hflag { font-size: 11px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
.tag-sample { font-size: 11px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-4); }
.note { padding: 2px 0 2px 14px; border-left: 1px solid var(--line-2); color: var(--ink-2); display: block; font-size: 14px; }
.note.warn, .note.bad { border-left-color: var(--accent); color: var(--accent); }
.notice { display: flex; gap: 12px 20px; align-items: center; justify-content: space-between; flex-wrap: wrap; border: 1px solid var(--line); padding: 14px 20px; margin-bottom: 24px; color: var(--ink-3); }
.notice strong { color: var(--ink); font-weight: 500; }
.notice p { max-width: 80ch; }
.errors { border-left: 1px solid var(--accent); padding: 4px 0 4px 14px; color: var(--accent); animation: errIn .4s var(--ease); }
.errors ul { margin: 4px 0 0; padding-left: 18px; }
@keyframes errIn { 0% { opacity: 0; transform: translateY(-4px); } 60% { opacity: 1; transform: translateX(-3px); } 80% { transform: translateX(2px); } 100% { transform: none; } }

/* Halka: ince ve tek renk */
.ring { position: relative; display: grid; place-items: center; aspect-ratio: 1; }
.ring svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
.ring-bg { fill: none; stroke: var(--ring-bg, var(--track)); stroke-width: 3; }
.ring-fg { fill: none; stroke: var(--ring, var(--dark)); stroke-width: 3; stroke-linecap: butt; }
.ring-c { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; line-height: 1.1; gap: 4px; }
.ring-c strong { font-family: var(--serif); font-weight: 400; }
.ring-c span { font-size: 12px; color: var(--ink-3); }

/* Özet */
.bento { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 20px; }
.b-hero { grid-column: span 8; grid-row: span 2; }
.b-4 { grid-column: span 4; }
.b-6 { grid-column: span 6; }
.b-12 { grid-column: span 12; }
@media (max-width: 1150px) { .bento { grid-template-columns: repeat(6, minmax(0, 1fr)); } .b-hero { grid-column: span 6; grid-row: auto; } .b-4, .b-6.md-3 { grid-column: span 3; } }
@media (max-width: 640px) { .bento { grid-template-columns: minmax(0, 1fr); gap: 14px; } .b-hero, .b-4, .b-6, .b-6.md-3, .b-12 { grid-column: auto; } }
.hero { display: flex; align-items: center; justify-content: space-between; gap: 32px; padding: 36px clamp(22px, 3.4vw, 44px); min-height: 300px; }
.hero-txt { display: flex; flex-direction: column; gap: 14px; max-width: 480px; }
.hello { font-size: 11px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
.hero h1 { font-size: clamp(36px, 4.2vw, 52px); line-height: 1.05; }
.hero-sub { color: var(--ink-2); font-size: 15.5px; }
.hero .head-actions { margin-top: 10px; }
.hero-ring { flex: none; width: clamp(150px, 16vw, 196px); }
.hero-ring .ring-c strong { font-size: clamp(36px, 3.8vw, 46px); }
.hero-ring .ring-c span { max-width: 110px; }
@media (max-width: 640px) { .hero { flex-direction: column; align-items: flex-start; padding: 28px 22px; } .hero-ring { align-self: center; width: 150px; } }
.stat { display: flex; flex-direction: column; gap: 6px; padding: 24px 26px 20px; }
.stat-head { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: none; padding: 0; cursor: pointer; text-align: left; color: inherit; }
.stat-l { font-size: 11px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
.stat-go { margin-left: auto; color: var(--ink-4); display: grid; transition: transform .25s var(--ease), color .2s; }
.stat-go .ico { width: 16px; height: 16px; }
.stat-head:hover .stat-go { transform: translateX(3px); color: var(--ink); }
.stat-head:hover .stat-l { color: var(--ink); }
.stat-n { margin-top: 12px; font-family: var(--serif); font-size: 54px; line-height: 1; color: var(--ink); }
.stat.tone-warn .stat-n, .stat.tone-bad .stat-n { color: var(--accent); }
.stat.zero .stat-n { color: var(--ink-4); }
.stat-s { color: var(--ink-3); font-size: 13px; }
.mini { list-style: none; margin: 14px 0 0; padding: 0; border-top: 1px solid var(--line); }
.mini > li + li { border-top: 1px solid var(--line); }
.mini-empty { padding: 14px 0 2px; color: var(--ink-4); font-size: 13.5px; }
.li { display: flex; align-items: center; gap: 12px; padding: 11px 0; width: 100%; border: 0; background: transparent; text-align: left; cursor: pointer; }
.li:hover .li-name { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
.li-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.li-name { font-weight: 500; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; font-size: 14px; }
.li-sub { font-size: 12.5px; color: var(--ink-3); }
.li-end { text-align: right; flex: none; font-size: 13px; }
.li-end .num { font-variant-numeric: tabular-nums; }
.welcome { padding: 32px; display: flex; flex-direction: column; gap: 14px; align-items: flex-start; }
.welcome h2 { font-size: 28px; }
.howto { margin: 6px 0 0; padding-left: 20px; color: var(--ink-2); display: flex; flex-direction: column; gap: 6px; }

/* Üye listesi */
.toolbar { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
.search { flex: 1 1 280px; position: relative; }
.search .ico { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--ink-4); pointer-events: none; }
.toolbar .search input { padding-left: 42px; }
.sort { display: flex; align-items: center; gap: 10px; color: var(--ink-3); font-size: 13px; }
.sort select { width: auto; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 22px; }
.chip { display: inline-flex; gap: 7px; align-items: center; border: 1px solid var(--line-2); background: transparent; padding: 6px 14px; font-size: 13px; cursor: pointer; color: var(--ink-2); transition: background .2s, color .2s, border-color .2s; }
.chip:hover { border-color: var(--dark); color: var(--ink); }
.chip.on { background: var(--dark); border-color: var(--dark); color: var(--on-dark); }
.chip-n { opacity: .6; font-variant-numeric: tabular-nums; }
.rows { border-top: 1px solid var(--dark); }
.row { display: grid; grid-template-columns: minmax(0, 2.2fr) minmax(0, 1.4fr) minmax(0, .9fr) minmax(0, 1.1fr); align-items: center; gap: 20px; width: 100%; text-align: left; padding: 16px 10px; border: 0; border-bottom: 1px solid var(--line); background: transparent; cursor: pointer; transition: background .2s; }
.row:hover { background: var(--panel); }
.row-main { min-width: 0; }
.row-name { font-weight: 500; font-size: 15px; display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.row-meta { display: block; color: var(--ink-3); font-size: 12.5px; }
.row-remain strong { display: block; font-size: 15px; font-weight: 500; }
.row-remain small, .row-last small { display: block; color: var(--ink-3); font-size: 12px; }
.row-last strong { display: block; font-size: 14px; font-weight: 400; }
.bar { display: block; height: 2px; background: var(--track); overflow: hidden; margin-top: 8px; max-width: 150px; }
.bar > span { display: block; height: 100%; background: var(--tone, var(--dark)); }
.row-pills { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.empty { padding: 36px; text-align: center; color: var(--ink-3); }
@media (max-width: 760px) {
  .row { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "main rem" "pills pills"; row-gap: 6px; padding: 14px 4px; }
  .row-main { grid-area: main; }
  .row-remain { grid-area: rem; text-align: right; }
  .row-remain .bar { margin-left: auto; width: 80px; }
  .row-last { display: none; }
  .row-pills { grid-area: pills; flex-direction: row; flex-wrap: wrap; gap: 14px; align-items: center; }
}

/* Formlar */
.form { display: flex; flex-direction: column; gap: 18px; }
.form-sec { padding: 28px 30px 30px; display: flex; flex-direction: column; gap: 18px; }
.form-sec h2 { font-size: 25px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.form-sec h2 small { font-family: var(--font); font-size: 13px; color: var(--ink-3); }
.step { width: 28px; height: 28px; display: inline-grid; place-items: center; border: 1px solid var(--line-2); font-family: var(--font); font-size: 12.5px; color: var(--ink-3); flex: none; }
.sub-h { font-family: var(--serif); font-size: 19px; }
.msec { display: flex; flex-direction: column; gap: 14px; }
.msec + .msec { padding-top: 18px; border-top: 1px solid var(--line); }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; border: 0; padding: 0; margin: 0; }
.field > span, .field > legend { font-size: 13px; color: var(--ink-2); padding: 0; }
.field > legend { margin-bottom: 6px; }
.field em { font-style: normal; color: var(--ink-4); }
.field.inline { flex-direction: row; align-items: center; }
input[type="text"], input[type="search"], input[type="date"], input[type="time"], input[type="number"], input[type="tel"], input[type="password"], select, textarea {
  width: 100%; min-height: 44px; padding: 10px 14px; border: 1px solid var(--line-2); background: var(--bg); color: var(--ink); transition: border-color .2s;
}
select { padding-right: 32px; }
textarea { min-height: 72px; resize: vertical; }
input:hover, select:hover, textarea:hover { border-color: var(--ink-4); }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--dark); }
input::placeholder, textarea::placeholder { color: var(--ink-4); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 18px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px 18px; }
.align-end { align-items: end; }
.price-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 680px) { .grid2, .grid3 { grid-template-columns: minmax(0, 1fr); } .price-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .form-sec { padding: 22px 18px 24px; } }
.pkg-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 680px) { .pkg-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.pkg { position: relative; display: flex; flex-direction: column; align-items: flex-start; padding: 14px 16px; border: 1px solid var(--line-2); cursor: pointer; background: var(--bg); transition: background .2s, border-color .2s, color .2s; }
.pkg:hover { border-color: var(--dark); }
.pkg input { position: absolute; opacity: 0; pointer-events: none; }
.pkg-n { font-family: var(--serif); font-size: 36px; line-height: 1; }
.pkg-u { color: var(--ink-3); font-size: 12.5px; }
.pkg-price { font-size: 13px; min-height: 1.5em; margin-top: 10px; }
.pkg-tag { font-size: 11.5px; color: var(--ink-4); }
.pkg-tag.ok { color: var(--ink-3); }
.pkg:has(input:checked) { background: var(--dark); border-color: var(--dark); color: var(--on-dark); }
.pkg:has(input:checked) .pkg-u, .pkg:has(input:checked) .pkg-tag { color: #CFCDBE; }
.pkg:has(input:focus-visible) { outline: 1px solid var(--ink); outline-offset: 3px; }
.seg-opts { display: inline-flex; align-self: flex-start; border: 1px solid var(--line-2); }
.seg-opts label { position: relative; padding: 9px 18px; cursor: pointer; color: var(--ink-3); transition: background .2s, color .2s; }
.seg-opts label + label { border-left: 1px solid var(--line-2); }
.seg-opts input { position: absolute; opacity: 0; pointer-events: none; }
.seg-opts label:has(input:checked) { background: var(--dark); color: var(--on-dark); }
.seg-opts label:has(input:focus-visible) { outline: 1px solid var(--ink); outline-offset: 2px; }
.seg-opts label.off { opacity: .4; cursor: not-allowed; }
.inst-note { font-size: 13px; color: var(--ink-3); margin-top: -4px; }
.pay-foot .pay-max { margin-left: auto; }
.check { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; min-height: 44px; }
.check input { width: 17px; height: 17px; accent-color: var(--dark); }
.preview { border: 1px solid var(--line); background: var(--bg); padding: 8px 16px; display: flex; flex-direction: column; justify-content: center; }
.preview span { font-size: 12px; color: var(--ink-3); }
.preview strong { font-family: var(--serif); font-weight: 400; font-size: 22px; line-height: 1.25; }
.meas-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px 16px; }
.inst-total { margin-top: 8px; color: var(--ink-3); }
.form-foot { position: sticky; bottom: 0; z-index: 5; display: flex; gap: 10px; justify-content: flex-end; align-items: center; padding: 16px 0 10px; background: linear-gradient(to top, var(--bg) 72%, rgba(255, 254, 242, 0)); }
@media (max-width: 900px) { .form-foot { bottom: 62px; } }
.info-box { border-left: 1px solid var(--line-2); padding: 2px 0 2px 14px; color: var(--ink-3); max-width: 80ch; }
.xf-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.xf-list li { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); max-width: 420px; }
.xf-list em { font-style: normal; color: var(--ink-3); }

/* Tablolar */
.tbl-wrap { overflow-x: auto; border-top: 1px solid var(--dark); }
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th, .tbl td { padding: 11px 12px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl thead th { font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-3); white-space: nowrap; }
.tbl thead th small { text-transform: none; letter-spacing: 0; }
.tbl tbody tr { transition: background .2s; }
.tbl tbody tr:hover { background: var(--panel-2); }
.tbl .r { text-align: right; }
.tbl tbody th { font-weight: 500; white-space: nowrap; }
.tbl th small { color: var(--ink-4); font-weight: 400; }
.tbl input { min-height: 38px; padding: 6px 10px; }
.tbl td.actions { white-space: nowrap; }
.tbl td.actions .btn + .btn { margin-left: 4px; }
.hist thead th { vertical-align: top; text-transform: none; letter-spacing: 0; color: var(--ink-2); }
.hist .hn { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-3); }
.hist .hd { display: block; color: var(--ink); font-size: 13.5px; font-weight: 500; }
.hist .hacts { display: flex; gap: 10px; justify-content: flex-end; margin-top: 4px; font-size: 12.5px; }
.hist td:last-child, .hist thead th:last-child { background: var(--panel-2); }
.note-cell { color: var(--ink-3); font-size: 13px; min-width: 120px; }
.delta { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; color: var(--ink-2); }
.delta.same { color: var(--ink-4); }
.cmp-bar { display: flex; gap: 14px; align-items: flex-end; flex-wrap: wrap; }
.cmp-bar .field { flex: 1 1 220px; }
.cmp-arrow { padding-bottom: 10px; color: var(--ink-4); font-size: 18px; }
.cmp-sum { padding: 18px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); font-family: var(--serif); font-size: 22px; line-height: 1.4; color: var(--ink); }
.cmp-sum strong { font-weight: 400; }
.pay-foot { display: flex; flex-wrap: wrap; gap: 6px 20px; align-items: center; margin-top: 14px; color: var(--ink-3); }
.pay-foot .link-btn { margin-left: auto; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.stat-box { border-top: 1px solid var(--dark); padding: 12px 0 4px; display: flex; flex-direction: column; }
.stat-box small { color: var(--ink-3); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }
.stat-box strong { font-family: var(--serif); font-weight: 400; font-size: 28px; line-height: 1.25; }
.stat-box.bad strong { color: var(--accent); }

/* Üye sayfası */
.m-head { display: flex; gap: 18px 28px; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; }
.m-title { display: flex; align-items: center; gap: 16px; min-width: 0; flex: 1 1 320px; }
.m-title h1 { font-size: clamp(34px, 4.2vw, 48px); line-height: 1.05; overflow-wrap: anywhere; }
.m-meta { color: var(--ink-3); display: flex; gap: 2px 18px; flex-wrap: wrap; margin-top: 8px; font-size: 13.5px; }
.m-pills { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 10px; align-items: center; }
.m-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.health { display: block; border-left: 1px solid var(--accent); padding: 4px 0 4px 16px; margin-top: 24px; color: var(--accent); }
.health strong { font-weight: 500; }
.status-card { margin-top: 26px; display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 20px; align-items: stretch; }
@media (max-width: 900px) { .status-card { grid-template-columns: minmax(0, 1fr); } }
.mcard { display: flex; align-items: center; justify-content: space-between; gap: 22px; min-height: 230px; padding: 28px 30px; background: var(--panel); color: var(--ink); --ring: var(--tone); }
.mcard-l { align-self: stretch; display: flex; flex-direction: column; justify-content: space-between; gap: 18px; min-width: 0; }
.mcard .logo { font-size: 24px; }
.mcard-stamp { align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: var(--tone-text); }
.mcard-stamp .ico { width: 14px; height: 14px; }
.mcard-name { font-family: var(--serif); font-size: 26px; line-height: 1.15; }
.mcard-no { font-size: 12.5px; color: var(--ink-3); margin-top: 4px; }
.mcard .ring { width: clamp(130px, 13vw, 160px); flex: none; }
.mcard .ring-c strong { font-size: clamp(40px, 4vw, 52px); color: var(--tone-text); }
.sc-info { display: flex; flex-direction: column; justify-content: center; gap: 22px; min-width: 0; padding: 28px 30px; }
.sc-dates { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 18px 22px; margin: 0; }
.sc-dates dt { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.sc-dates dd { margin: 4px 0 0; font-family: var(--serif); font-size: 21px; line-height: 1.2; }
.meter { height: 2px; background: var(--track); overflow: hidden; }
.meter > span { display: block; height: 100%; background: var(--tone, var(--dark)); }
.tabs { display: flex; gap: 26px; border-bottom: 1px solid var(--line); margin: 34px 0 24px; overflow-x: auto; max-width: 100%; }
.tab { border: 0; border-bottom: 1px solid transparent; margin-bottom: -1px; background: transparent; padding: 10px 0; color: var(--ink-3); font-size: 14.5px; cursor: pointer; white-space: nowrap; display: inline-flex; gap: 7px; align-items: baseline; transition: color .2s, border-color .2s; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--dark); }
.tab .n { font-size: 11.5px; color: var(--ink-4); }
.tab .dot { width: 5px; height: 5px; border-radius: 50% !important; background: var(--accent); align-self: center; }
.tab-body { animation: fadeUp .35s var(--ease); }
@keyframes fadeUp { from { opacity: .3; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.info { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px 28px; margin: 0; }
.info dt { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.info dd { margin: 3px 0 0; overflow-wrap: anywhere; }
.flist, .pk-list, .ci-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.f-li, .pk-li { display: flex; align-items: center; gap: 14px; padding: 13px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.f-li.on .f-main strong { color: var(--ink); }
.f-ic { color: var(--ink-3); display: grid; }
.f-main, .pk-main { flex: 1 1 200px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.pk-main strong, .f-main strong { font-weight: 500; display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.f-acts, .pk-acts { display: flex; gap: 4px; }
.ci-list li { display: flex; align-items: center; gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.ci-list li span:first-child { flex: 1; }
.giris-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .giris-grid { grid-template-columns: minmax(0, 1fr); } }
.cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.cal-head strong { font-family: var(--serif); font-weight: 400; font-size: 22px; text-transform: capitalize; }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal-dow { font-size: 11px; color: var(--ink-3); text-align: center; letter-spacing: .06em; }
.cal-d { aspect-ratio: 1 / .86; display: grid; place-items: center; font-size: 13px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.cal-d.blank { background: transparent; }
.cal-d.out { color: #BDBAA8; }
.cal-d.in { background: var(--dark); color: var(--on-dark); }
.cal-d.frz { background: repeating-linear-gradient(135deg, #E2DFCF 0 4px, transparent 4px 8px); color: var(--ink-3); }
.cal-d.today { box-shadow: inset 0 0 0 1px var(--dark); color: var(--ink); }
.cal-legend { display: flex; gap: 6px 18px; font-size: 12.5px; color: var(--ink-3); margin: 14px 0 6px; flex-wrap: wrap; }
.sw { display: inline-block; width: 11px; height: 11px; vertical-align: -1px; margin-right: 6px; }
.sw.in { background: var(--dark); }
.sw.frz { background: repeating-linear-gradient(135deg, #CFCBB8 0 2px, transparent 2px 4px); box-shadow: inset 0 0 0 1px #CFCBB8; }
.sw.out { box-shadow: inset 0 0 0 1px var(--line-2); }

/* Grafik: tek çizgi, kömür grisi */
.chart { position: relative; min-height: 220px; }
.chart svg { display: block; overflow: visible; touch-action: pan-y; }
.ch-grid { stroke: var(--line); stroke-width: 1; }
.ch-axis { fill: var(--ink-3); font-size: 11.5px; font-family: var(--font); }
.ch-line { fill: none; stroke: var(--dark); stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
.ch-area { fill: var(--dark); opacity: .045; }
.ch-dot { fill: var(--dark); stroke: var(--panel); stroke-width: 2; }
.ch-hl { fill: none; stroke: var(--dark); stroke-width: 1.5; }
.ch-val { fill: var(--ink); font-size: 12.5px; font-family: var(--font); paint-order: stroke; stroke: var(--panel); stroke-width: 4px; stroke-linejoin: round; }
.ch-cross { stroke: var(--ink-4); stroke-width: 1; }
.ch-tip { position: absolute; pointer-events: none; background: var(--dark); color: var(--on-dark); padding: 6px 10px; font-size: 12.5px; white-space: nowrap; transform: translate(-50%, calc(-100% - 12px)); }
.ch-tip strong { display: block; font-size: 14px; font-weight: 500; }

/* Pencere ve bildirim */
.modal-back { position: fixed; inset: 0; z-index: 100; background: rgba(51, 51, 51, .32); display: grid; place-items: center; padding: 16px; animation: fadeIn .2s ease; }
.modal { width: min(540px, 100%); max-height: calc(100vh - 32px); overflow: auto; background: var(--bg); color: var(--ink); border: 1px solid var(--line-2); display: flex; flex-direction: column; animation: modalIn .25s var(--ease); }
.modal.wide { width: min(800px, 100%); }
@keyframes fadeIn { from { opacity: 0; } }
@keyframes modalIn { from { opacity: 0; transform: translateY(8px); } }
.modal > header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 20px 18px 16px 28px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); z-index: 2; }
.modal h2 { font-size: 25px; }
.modal-body { padding: 22px 28px; display: flex; flex-direction: column; gap: 16px; }
.modal > footer { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; padding: 16px 28px; border-top: 1px solid var(--line); position: sticky; bottom: 0; background: var(--bg); z-index: 2; }
.modal > footer .left { margin-right: auto; }
.toasts { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 300; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; width: max-content; max-width: 92vw; }
@media (max-width: 900px) { .toasts { bottom: 80px; } }
.toast { background: var(--dark); color: var(--on-dark); padding: 11px 18px; font-size: 13.5px; animation: toastIn .3s var(--ease); }
.toast.bad { background: var(--accent); }
@keyframes toastIn { from { opacity: 0; transform: translateY(8px); } }

/* Turnike ekranı: krem zemin, ince halka, yalnızca ad ve kalan gün */
.kiosk { position: fixed; inset: 0; z-index: 50; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; background: var(--bg); color: var(--ink); overflow: hidden; }
.k-top { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 26px clamp(22px, 4vw, 52px); border-bottom: 1px solid var(--line); }
.k-top .logo { font-size: clamp(28px, 4vh, 38px); }
.k-clock { text-align: right; }
.k-clock strong { display: block; font-family: var(--serif); font-weight: 400; font-size: clamp(30px, 3.6vw, 44px); line-height: 1; }
.k-clock small { color: var(--ink-3); font-size: 13px; }
.k-stage { display: grid; place-items: center; padding: 10px 20px; text-align: center; overflow: auto; }
.k-idle { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.k-mark { display: flex; flex-direction: column; align-items: center; gap: 1.2vh; margin-bottom: 5vh; }
.k-mark .logo { font-size: clamp(64px, 11vw, 132px); }
.k-mark .brand-sub { font-size: clamp(11px, 1.3vw, 15px); padding-left: .32em; }
.k-idle h1 { font-size: clamp(32px, 4.4vw, 54px); line-height: 1.05; }
.k-idle p { color: var(--ink-3); font-size: 16px; display: inline-flex; align-items: center; gap: 12px; }
.k-dot { width: 7px; height: 7px; border-radius: 50% !important; background: var(--dark); animation: kpulse 2.6s ease-in-out infinite; }
@keyframes kpulse { 50% { opacity: .25; } }
.k-res { display: flex; flex-direction: column; align-items: center; gap: 14px; width: min(600px, 92vw); padding: clamp(26px, 4.5vh, 46px) clamp(22px, 4vw, 48px); background: var(--panel); animation: pop .4s var(--ease); --ring: var(--tone); }
@keyframes pop { from { opacity: 0; transform: translateY(8px); } }
.k-hello { font-family: var(--serif); font-size: clamp(28px, 3.6vw, 40px); line-height: 1.15; }
.k-hello strong { font-weight: 400; }
.k-res .ring { width: clamp(190px, 30vh, 270px); }
.k-res .ring-c strong { font-size: clamp(72px, 12vh, 124px); color: var(--tone-text); }
.k-res .ring-c span { font-size: clamp(14px, 2vh, 18px); }
.k-badge { width: 76px; height: 76px; border-radius: 50% !important; display: grid; place-items: center; border: 1px solid var(--tone, var(--ink-4)); color: var(--tone-text); }
.k-badge .ico { width: 34px; height: 34px; }
.k-title { font-family: var(--serif); font-size: clamp(32px, 4.4vw, 50px); line-height: 1.1; color: var(--tone-text); }
.k-sub { font-size: clamp(16px, 2.1vw, 20px); color: var(--ink-2); }
.k-msg { font-size: clamp(16px, 2vw, 19px); color: var(--ink-3); max-width: 36ch; }
.k-msg.hl { color: var(--tone-text); padding: 10px 0; border-top: 1px solid var(--line-2); border-bottom: 1px solid var(--line-2); }
.k-form { display: flex; gap: 8px; justify-content: center; padding: 0 20px 30px; }
.k-form input { width: min(300px, 62vw); min-height: 48px; text-align: center; font-size: 17px; letter-spacing: .12em; }
.k-form input::placeholder { letter-spacing: .02em; }
.k-form button { min-height: 48px; padding: 0 26px; border: 1px solid var(--dark); background: var(--dark); color: var(--on-dark); font-size: 14px; letter-spacing: .03em; cursor: pointer; transition: background .2s; }
.k-form button:hover { background: var(--dark-2); }
.k-exit { position: absolute; z-index: 2; right: 18px; bottom: 18px; background: transparent; border: 1px solid var(--line-2); color: var(--ink-3); padding: 7px 14px; cursor: pointer; font-size: 12.5px; }
.k-exit:hover { color: var(--ink); border-color: var(--dark); }
@media (max-width: 560px) { .k-exit { position: static; margin: 0 auto 16px; } }

/* Renk: markanın ilk seçtiği petrol yeşili (#166866) ana renk, dikkat isteyen durumlar kiremit. Zemin sakin krem kalır. */
:root { --teal: #166866; --teal-2: #0F4F4D; --teal-soft: #E3EEEA; --cream: #FFFEF2; --accent: #B4532A; --accent-soft: #F7E7DC; --frost: #5F7A76; }
:focus-visible { outline-color: var(--teal); }
::selection { background: var(--teal-soft); }
.tone-good { --tone: var(--teal); --tone-text: var(--teal); }
.tone-ice { --tone: var(--frost); --tone-text: var(--frost); }
.logo { color: var(--teal); }
.nav a.on { color: var(--teal); }
.nav a.on span:first-of-type { text-decoration-color: var(--teal); text-decoration-thickness: 2px; }
.tabbar a.on { color: var(--teal); }
.btn-primary { background: var(--teal); border-color: var(--teal); color: var(--cream); }
.btn-primary:hover { background: var(--teal-2); border-color: var(--teal-2); }
.btn.is-done { background: var(--teal); border-color: var(--teal); color: var(--cream); }
.btn-danger:hover { background: var(--accent-soft); }
.btn-danger-solid:hover { background: #8F3F1E; }
.link-btn { color: var(--teal); }
.chip:hover { border-color: var(--teal); }
.chip.on { background: var(--teal); border-color: var(--teal); color: var(--cream); }
input:focus, select:focus, textarea:focus { border-color: var(--teal); box-shadow: 0 0 0 1px var(--teal); }
.check input { accent-color: var(--teal); }
.pkg:hover { border-color: var(--teal); }
.pkg:has(input:checked) { background: var(--teal); border-color: var(--teal); color: var(--cream); }
.pkg:has(input:checked) .pkg-u, .pkg:has(input:checked) .pkg-tag { color: rgba(255, 254, 242, .78); }
.pkg-tag.ok { color: var(--teal); }
.seg-opts label:has(input:checked) { background: var(--teal); color: var(--cream); }
.step { border-color: var(--teal); color: var(--teal); }
.pill.good { color: var(--teal); }
.pill.ice { color: var(--frost); }
.notice { background: var(--teal-soft); border-color: transparent; color: #3E5653; }
.notice strong { color: var(--teal); }
.notice .btn { border-color: var(--teal); color: var(--teal); }
.notice .btn:hover { background: rgba(22, 104, 102, .08); }
.note.ice { border-left-color: var(--frost); color: var(--frost); }
.health { background: var(--accent-soft); border-left: 2px solid var(--accent); padding: 12px 18px; }
/* Özet: petrol yeşili ana kart, özet kartlarında ince renkli üst çizgi */
.card.hero { background: var(--teal); color: var(--cream); --ring: var(--cream); --ring-bg: rgba(255, 254, 242, .22); }
.hero .hello { color: rgba(255, 254, 242, .72); }
.hero-sub { color: rgba(255, 254, 242, .88); }
.hero .btn { border-color: rgba(255, 254, 242, .6); color: var(--cream); }
.hero .btn:hover { background: rgba(255, 254, 242, .1); }
.hero .btn-primary { background: var(--cream); border-color: var(--cream); color: var(--teal); }
.hero .btn-primary:hover { background: #EDEBDA; border-color: #EDEBDA; }
.hero .ring-c strong { color: var(--cream); }
.hero .ring-c span { color: rgba(255, 254, 242, .78); }
.stat { border-top: 2px solid var(--tone, var(--line-2)); }
.stat.tone-good .stat-n { color: var(--teal); }
.stat.tone-ice .stat-n { color: var(--frost); }
.stat-head:hover .stat-go, .stat-head:hover .stat-l { color: var(--teal); }
/* Üye kartı: duruma göre tek renk blok */
.mcard { background: var(--teal); color: var(--cream); --ring: var(--cream); --ring-bg: rgba(255, 254, 242, .22); }
.mcard.warn { background: var(--accent); }
.mcard.donduruldu { background: var(--frost); }
.mcard.bitti, .mcard.yok { background: #3B3B39; }
.mcard .logo, .mcard .ring-c strong, .mcard-stamp { color: var(--cream); }
.mcard-no, .mcard .ring-c span { color: rgba(255, 254, 242, .8); }
.tab { border-bottom-width: 2px; }
.tab[aria-selected="true"] { color: var(--teal); border-bottom-color: var(--teal); }
.delta.down { color: var(--teal); }
.delta.up { color: var(--accent); }
.cmp-sum strong { color: var(--teal); }
.hist td:last-child, .hist thead th:last-child { background: var(--teal-soft); }
.cal-d.in { background: var(--teal); color: var(--cream); }
.sw.in { background: var(--teal); }
.ch-line { stroke: var(--teal); }
.ch-area { fill: var(--teal); opacity: .08; }
.ch-dot { fill: var(--teal); }
.ch-hl { stroke: var(--teal); }
.ch-tip { background: var(--teal); }
.toast { background: var(--teal); }

/* Kart: numara görünmez, yalnızca okutulur. Okuyucunun yazdığını gizli kutu yakalar. */
.scan { position: relative; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; min-height: 44px; }
.scan-in[type="text"] { position: absolute; left: 0; top: 0; width: 1px; height: 1px; min-height: 0; padding: 0; border: 0; opacity: 0; pointer-events: none; }
.scan-state { font-size: 13.5px; color: var(--ink-3); display: inline-flex; align-items: center; gap: 8px; }
.scan-state.ok { color: var(--teal, #166866); }
.scan-state.ok::before { content: "✓"; }
.scan-state.wait { color: var(--ink); }
.scan-state.wait::before { content: ""; width: 7px; height: 7px; border-radius: 50% !important; background: var(--teal, #166866); animation: kpulse 1.6s ease-in-out infinite; }
.scan-wait { display: flex; align-items: center; justify-content: center; gap: 14px; padding: 26px 0; border: 1px dashed var(--line-2); font-family: var(--serif); font-size: 22px; cursor: pointer; }
.k-form { position: absolute; left: 0; bottom: 0; width: 1px; height: 1px; overflow: hidden; opacity: 0; padding: 0; }

/* Vücut kitle indeksi */
.bmi-live { font-size: 13.5px; color: var(--ink-3); padding: 10px 0 0; border-top: 1px solid var(--line); }
.bmi-live.on { color: var(--ink-2); }
.bmi-live strong { color: var(--ink); font-weight: 500; }
.bmi-live strong.t-bad { color: var(--accent); }
.bmi-card .stat-box span.sm { color: var(--ink-3); }
.bmi-card .stat-box.bad span.sm { color: var(--ink-3); }
.hist .bmi-row th, .hist .bmi-row td { color: var(--teal, #166866); }

/* Kaydırınca yumuşakça beliren bölümler (destekleyen tarayıcılarda) */
@supports (animation-timeline: view()) {
  @media (prefers-reduced-motion: no-preference) {
    .bento > .card, .tab-body .card, .tab-body .tbl-wrap, .form-sec { animation: reveal linear both; animation-timeline: view(); animation-range: entry 0% entry 30%; }
    @keyframes reveal { from { opacity: 0; translate: 0 12px; } }
  }
}
@media print { .bento > .card, .tab-body .card, .tab-body .tbl-wrap, .form-sec { animation: none !important; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
</style>

<script>
/* ===== Mantık: tarih, üyelik, dondurma, ödeme, ölçüm. DOM kullanmaz, ayrı test edilir. ===== */
const PACKAGES = [1, 3, 6, 9, 12];
const DAY_MS = 86400000;
const pad2 = n => String(n).padStart(2, '0');

/* --- Tarihler: her gün "YYYY-AA-GG" metni olarak tutulur, karşılaştırma metin sırasıyla yapılır --- */
function ymdLocal(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function todayStr(now) { return ymdLocal(now || new Date()); }
function hmLocal(now) { const d = now || new Date(); return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }
function isYMD(s) {
  if (typeof s !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
  const [y, m, d] = s.split('-').map(Number);
  const t = new Date(Date.UTC(y, m - 1, d));
  return t.getUTCFullYear() === y && t.getUTCMonth() === m - 1 && t.getUTCDate() === d;
}
function utcOf(s) { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); }
function ymdUTC(t) { const d = new Date(t); return d.getUTCFullYear() + '-' + pad2(d.getUTCMonth() + 1) + '-' + pad2(d.getUTCDate()); }
function addDays(s, n) { return ymdUTC(utcOf(s) + n * DAY_MS); }
/* b - a, gün olarak */
function diffDays(a, b) { return Math.round((utcOf(b) - utcOf(a)) / DAY_MS); }
/* Ay ekler; 31 Ocak + 1 ay = 28/29 Şubat */
function addMonths(s, n) {
  const [y, m, d] = s.split('-').map(Number);
  const first = new Date(Date.UTC(y, m - 1 + n, 1));
  const last = new Date(Date.UTC(first.getUTCFullYear(), first.getUTCMonth() + 1, 0)).getUTCDate();
  return first.getUTCFullYear() + '-' + pad2(first.getUTCMonth() + 1) + '-' + pad2(Math.min(d, last));
}
const maxYMD = (a, b) => (a > b ? a : b);
/* from'dan to'ya (to hariç) kaç ay kaç gün */
function splitMonths(from, to) {
  if (!(to > from)) return { m: 0, d: 0 };
  let m = 0;
  while (m < 600 && addMonths(from, m + 1) <= to) m++;
  return { m, d: diffDays(addMonths(from, m), to) };
}

/* --- Üyelik ---
   Bir paket: { id, months, start, price, payType, installments[], freezes[] }
   end (bitiş) hariç tutulan gündür: üye end'den bir önceki güne kadar girebilir.
   Dondurma: { id, start, end|null }  end = üyenin döndüğü ilk gün (hariç). end yoksa dondurma sürüyor. */
function canFreezePackage(months) { return Number(months) >= 3; }
/* Paket başına yapılabilecek taksit sayıları: 1 ayda taksit yok, 3 ayda 2, 6 ayda 2-3, 9 ayda 2-5, 12 ayda 2-7 */
const INSTALLMENT_COUNTS = { 1: [], 3: [2], 6: [2, 3], 9: [2, 3, 4, 5], 12: [2, 3, 4, 5, 6, 7] };
function instCounts(months) { return (INSTALLMENT_COUNTS[Number(months)] || []).slice(); }
function maxPayRows(months) { const o = instCounts(months); return o.length ? o[o.length - 1] : 1; }
function instRuleText(months) {
  const o = instCounts(months);
  if (!o.length) return months + ' aylık pakette taksit yapılmaz, ücret peşin alınır.';
  if (o.length === 1) return months + ' aylık pakette yalnızca ' + o[0] + ' taksit yapılabilir.';
  if (o.length === 2) return months + ' aylık pakette ' + o[0] + ' ya da ' + o[1] + ' taksit yapılabilir.';
  return months + ' aylık pakette ' + o[0] + ' ile ' + o[o.length - 1] + ' arası taksit yapılabilir.';
}
function freezeLen(f, today) {
  const end = f.end || maxYMD(today, f.start);
  return Math.max(0, diffDays(f.start, end));
}
function isFreezeActive(f, today) { return f.start <= today && (!f.end || today < f.end); }

function calcMembership(ms, effStart, today) {
  const months = Number(ms.months) || 1;
  const baseEnd = addMonths(effStart, months);
  let frozen = 0, active = null, upcoming = null;
  const fr = Array.isArray(ms.freezes) ? ms.freezes : [];
  for (const f of fr) {
    if (!f || !isYMD(f.start)) continue;
    frozen += freezeLen(f, today);
    if (isFreezeActive(f, today)) active = f;
    else if (f.start > today && (!upcoming || f.start < upcoming.start)) upcoming = f;
  }
  const end = addDays(baseEnd, frozen);
  const status = today < effStart ? 'bekliyor' : today >= end ? 'bitti' : active ? 'donduruldu' : 'aktif';
  return {
    ms, months, effStart, baseEnd, end, lastDay: addDays(end, -1),
    frozenDays: frozen, activeFreeze: active, upcomingFreeze: upcoming, status,
    totalDays: diffDays(effStart, end), usableDays: diffDays(effStart, baseEnd)
  };
}

/* Bugünden sonra planlı (dönüş tarihi belli) dondurma günleri: kalan güne sayılmaz */
function frozenAhead(c, from) {
  let n = 0;
  for (const f of (c.ms.freezes || [])) {
    if (!f || !f.end || !isYMD(f.start)) continue;
    const s = maxYMD(f.start, from);
    if (f.end > s) n += diffDays(s, f.end);
  }
  return n;
}

function sortMemberships(list) {
  return list.slice().sort((a, b) =>
    a.start < b.start ? -1 : a.start > b.start ? 1 :
    String(a.createdAt || '') < String(b.createdAt || '') ? -1 : 1);
}

/* Üyenin bütün paketlerini sırayla zincirler (yenileme önceki paketin bitişinden başlar). */
function calcMember(member, today, warnDays) {
  const warn = warnDays == null ? 7 : warnDays;
  const list = sortMemberships((member.memberships || []).filter(x => x && isYMD(x.start)));
  const calcs = [];
  let prevEnd = null;
  for (const ms of list) {
    const effStart = prevEnd && ms.start < prevEnd ? prevEnd : ms.start;
    const c = calcMembership(ms, effStart, today);
    calcs.push(c);
    prevEnd = c.end;
  }
  const cur = calcs.find(c => c.effStart <= today && today < c.end) || null;
  const next = cur ? null : (calcs.find(c => c.effStart > today) || null);
  const last = calcs.length ? calcs[calcs.length - 1] : null;
  const focus = cur || next || last;
  const status = cur ? cur.status : next ? 'bekliyor' : last ? 'bitti' : 'yok';
  let chain = [], chainEnd = null, remaining = 0, daysAgo = 0, total = 0;
  if (focus) {
    chain = [focus];
    chainEnd = focus.end;
    for (let j = calcs.indexOf(focus) + 1; j < calcs.length; j++) {
      if (calcs[j].effStart <= chainEnd) { chain.push(calcs[j]); chainEnd = calcs[j].end; } else break;
    }
    total = chain.reduce((n, c) => n + c.usableDays, 0);
    if (status === 'bitti') {
      daysAgo = diffDays(addDays(chainEnd, -1), today);
    } else {
      const from = status === 'bekliyor' ? focus.effStart : today;
      remaining = diffDays(from, chainEnd) - chain.reduce((n, c) => n + frozenAhead(c, from), 0);
    }
  }
  return {
    calcs, cur, next, focus, chain, status, remaining, total, daysAgo,
    chainEnd, lastDay: chainEnd ? addDays(chainEnd, -1) : null,
    warn: status === 'aktif' && remaining <= warn,
    lastDayToday: status === 'aktif' && remaining === 1,
    canFreeze: !!(cur && canFreezePackage(cur.months) && !cur.activeFreeze)
  };
}

function freezeError(s, start, end) {
  if (!s.cur) return 'Şu an devam eden bir üyelik yok.';
  if (!canFreezePackage(s.cur.months)) return '1 aylık pakette dondurma yapılamaz.';
  if (s.cur.activeFreeze) return 'Üyelik zaten dondurulmuş.';
  if (!isYMD(start)) return 'Dondurma başlangıç tarihini seç.';
  if (start < s.cur.effStart) return 'Dondurma, paketin başlangıcından (' + fmtDate(s.cur.effStart) + ') önce başlayamaz.';
  if (start >= s.cur.end) return 'Bu tarihte paket bitmiş oluyor. Son gün: ' + fmtDate(s.cur.lastDay) + '.';
  if (end && !isYMD(end)) return 'Dönüş tarihi geçersiz.';
  if (end && end <= start) return 'Dönüş tarihi, dondurma başlangıcından sonra olmalı.';
  const newEnd = end || '9999-12-31';
  for (const f of (s.cur.ms.freezes || [])) {
    const fEnd = f.end || '9999-12-31';
    if (start < fEnd && f.start < newEnd) return 'Bu tarihler başka bir dondurmayla çakışıyor.';
  }
  return null;
}

/* --- Ödeme --- */
const round2 = x => Math.round(x * 100) / 100;
const sumAmt = list => round2(list.reduce((s, i) => s + (Number(i.amount) || 0), 0));
function payInfo(ms, today) {
  const ins = Array.isArray(ms.installments) ? ms.installments : [];
  const unpaid = ins.filter(i => !i.paidAt);
  const overdue = unpaid.filter(i => isYMD(i.due) && i.due < today);
  const soon = unpaid.filter(i => isYMD(i.due) && i.due >= today && diffDays(today, i.due) <= 7);
  return {
    price: Number(ms.price) || 0, paid: sumAmt(ins.filter(i => i.paidAt)), debt: sumAmt(unpaid),
    overdue, overdueSum: sumAmt(overdue), soon, unpaid, count: ins.length, scheduled: sumAmt(ins)
  };
}
function memberPay(member, today) {
  let debt = 0, paid = 0, overdueSum = 0;
  const overdue = [], soon = [];
  for (const ms of (member.memberships || [])) {
    const p = payInfo(ms, today);
    debt += p.debt; paid += p.paid; overdueSum += p.overdueSum;
    p.overdue.forEach(i => overdue.push({ ms, i }));
    p.soon.forEach(i => soon.push({ ms, i }));
  }
  overdue.sort((a, b) => (a.i.due < b.i.due ? -1 : 1));
  return { debt: round2(debt), paid: round2(paid), overdueSum: round2(overdueSum), overdue, soon };
}
function uid(p) { return (p || 'x') + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
/* Ücreti eşit taksitlere böler; kuruş farkı ilk taksite eklenir */
/* Tutarı eşit böler: ücret tam liraysa taksitler de tam lira olur, artan kısım ilk taksite eklenir (7000 / 3 = 2334 + 2333 + 2333) */
function splitAmount(total, count) {
  count = Math.max(1, Math.floor(count) || 1);
  const cents = Math.round((Number(total) || 0) * 100);
  const unit = cents % 100 === 0 ? 100 : 1;
  const base = Math.floor(cents / unit / count) * unit;
  const rest = cents - base * count;
  const out = [];
  for (let i = 0; i < count; i++) out.push((base + (i === 0 ? rest : 0)) / 100);
  return out;
}
function makeInstallments(price, count, start) {
  count = Math.max(1, Math.min(24, Math.floor(count) || 1));
  return splitAmount(price, count).map((amount, i) => ({ id: uid('t'), no: i + 1, amount, due: addMonths(start, i), paidAt: null, method: null }));
}
/* Ücret değişince ödenmemiş taksitleri yeni ücrete göre yeniden böler; ödenmiş taksitler olduğu gibi kalır.
   Hepsi ödenmişse ve ücret arttıysa fark için yeni bir ödeme satırı eklenir. */
function respreadInstallments(ms, price, today) {
  const list = (ms.installments || []).map(x => Object.assign({}, x));
  const paid = list.filter(x => x.paidAt);
  const open = list.filter(x => !x.paidAt).sort((a, b) => (a.due < b.due ? -1 : a.due > b.due ? 1 : (a.no || 0) - (b.no || 0)));
  const paidSum = paid.reduce((n, x) => n + (Number(x.amount) || 0), 0);
  const left = Math.round((Number(price) - paidSum) * 100) / 100;
  let next;
  if (left <= 0) next = paid;
  else if (!open.length) next = list.concat({ id: uid('t'), no: list.length + 1, amount: left, due: today, paidAt: null, method: null });
  else { const parts = splitAmount(left, open.length); open.forEach((x, i) => { x.amount = parts[i]; }); next = paid.concat(open); }
  return next.sort((a, b) => (a.due < b.due ? -1 : a.due > b.due ? 1 : (a.no || 0) - (b.no || 0))).map((x, i) => Object.assign(x, { no: i + 1 }));
}

/* --- Ölçüm --- */
const DEFAULT_FIELDS = [
  { k: 'kilo', l: 'Kilo', u: 'kg' },
  { k: 'yag', l: 'Yağ oranı', u: '%' },
  { k: 'omuz', l: 'Omuz', u: 'cm' },
  { k: 'gogus', l: 'Göğüs', u: 'cm' },
  { k: 'sagKol', l: 'Sağ kol', u: 'cm' },
  { k: 'solKol', l: 'Sol kol', u: 'cm' },
  { k: 'bel', l: 'Bel', u: 'cm' },
  { k: 'ustKarin', l: 'Üst karın', u: 'cm' },
  { k: 'altKarin', l: 'Alt karın', u: 'cm' },
  { k: 'basen', l: 'Basen (kalça)', u: 'cm' },
  { k: 'sagBacak', l: 'Sağ bacak', u: 'cm' },
  { k: 'solBacak', l: 'Sol bacak', u: 'cm' },
  { k: 'sagBaldir', l: 'Sağ baldır', u: 'cm' },
  { k: 'solBaldir', l: 'Sol baldır', u: 'cm' }
];
/* Eski kayıtlardaki tek kol, bacak ve baldır ölçüleri: yalnızca o üyede değer varsa listede görünür */
const LEGACY_FIELDS = [
  { k: 'kol', l: 'Kol', u: 'cm' },
  { k: 'bacak', l: 'Bacak (uyluk)', u: 'cm' },
  { k: 'baldir', l: 'Baldır', u: 'cm' }
];
function fieldsForMember(m, extra) {
  const used = new Set();
  (m && Array.isArray(m.measurements) ? m.measurements : []).forEach(x => Object.keys((x && x.values) || {}).forEach(k => used.add(k)));
  return allFields(extra).concat(LEGACY_FIELDS.filter(f => used.has(f.k)));
}
/* Telefon: baştaki 0 (ya da +90) atılır, 10 hane 3-3-2-2 yazılır: 532 111 22 33 */
function phoneDigits(v) {

  if (d.length > 10 && d.startsWith('90')) d = d.slice(2).replace(/^0+/, '');

function parseNum(s) {

function weightReport(weight, heightCm) {
  const w = Number(weight), hc = Number(heightCm);
  if (!(w > 0) || !(hc > 0)) return null;
  const h2 = (hc / 100) * (hc / 100);
  const b = round1(w / h2);

  const min = round1(18.5 * h2), max = round1(24.9 * h2);
  const over = cls.k === 'zayif' || cls.k === 'normal' ? 0 : Math.max(0.1, round1(w - max));

}

async function openLocalStore() {

  try {
    if (!window.indexedDB) throw new Error('IndexedDB yok');

      rq.onblocked = () => rej(new Error('engellendi'));
    });
    await new Promise((res, rej) => {
      const rq = idb.transaction('docs', 'readonly').objectStore('docs').openCursor();
      rq.onsuccess = () => { const c = rq.result; if (c) { mem.set(String(c.key), c.value); c.continue(); } else res(); };
      rq.onerror = () => rej(rq.error);

    const tx = fn => new Promise((res, rej) => {
      const t = idb.transaction('docs', 'readwrite');
      fn(t.objectStore('docs'));
      t.oncomplete = () => res();
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error || new Error('iptal'));
    });

    const KEY = 'betia-uye-takip';

    catch (e2) { /* boş başla */ }

async function restoreFromFile(file) {

  const entries = docs ? Object.entries(docs).filter(([k, d]) => (/^members\/[A-Za-z0-9_-]{1,80}$/.test(k) || k === 'config/settings') && d && typeof d === 'object' && !Array.isArray(d)) : [];

/* ---------- Veri ---------- */
async function initData() {
  if (!window.claude || typeof window.claude.use !== 'function') {
    try { db = makeLocalDb(await openLocalStore()); S.local = true; }
    catch (e) { console.error(e); S.dbState = 'nodb'; renderAll(); return; }
    return subscribeData();
  }
  if (!window.claude || typeof window.claude.use !== 'function') { S.dbState = 'nodb'; renderAll(); return; }
  let user = null;
  try { user = await window.claude.use('user'); } catch (e) { user = null; }
  if (user && typeof user.canEdit === 'function') {
    try { if ((await user.canEdit()) === false) { S.dbState = 'denied'; renderAll(); return; } } catch (e) { /* bilinmiyor: devam */ }
  }
  try { db = await window.claude.use('db'); } catch (e) { db = null; }
  if (!db) { S.dbState = 'nodb'; renderAll(); return; }
  subscribeData();
}
function subscribeData() {
  const timer = setTimeout(() => { if (!S.loaded) { S.slow = true; renderBanner(); } }, 10000);
  db.collection('members').onSnapshot(snap => {
    const arr = snap.docs.filter(d => d.exists).map(d => Object.assign({ id: d.id }, d.data()));
    S.members = arr;
    S.byId = new Map(arr.map(m => [m.id, m]));
    if (!snap.metadata.fromCache) { S.loaded = true; S.slow = false; clearTimeout(timer); }
    const first = S.dbState !== 'ready';
    S.dbState = 'ready';
    if (first) renderAll(); else onData();
  }, err => {
    clearTimeout(timer);
    S.dbState = err && err.code === 'revoked' ? 'nodb' : 'error';
    S.loaded = true;
    renderAll();
  });
  db.doc('config/settings').onSnapshot(snap => {
    S.settingsDoc = snap.exists ? snap.data() : null;
    onSettings();
  }, () => {});
}

const chains = new Map();
function queueWrite(key, fn) {
  const run = async () => {
    try { await fn(); }
    catch (e) {
      if (e && e.code === 'unavailable') { await sleep(400 + Math.random() * 800); await fn(); }
      else throw e;
    }
  };
  const p = (chains.get(key) || Promise.resolve()).catch(() => {}).then(run);
  chains.set(key, p);
  return p;
}
function saveMember(id, data) {
  if (!db) return Promise.reject({ code: 'not_granted' });
  return queueWrite('m/' + id, () => db.collection('members').doc(id).set(data));
}
/* Var olan üyede yalnızca değişen alanlar yazılır: turnike girişi ile başka cihazdaki düzenleme birbirini ezmez. */
function patchMember(id, patch) {
  if (!db) return Promise.reject({ code: 'not_granted' });
  return queueWrite('m/' + id, () => db.collection('members').doc(id).update(patch));
}
function diffPatch(before, after) {
  const patch = {};
  for (const k of Object.keys(after)) {
    if (k === 'id' || k === 'updatedAt') continue;
    if (JSON.stringify(after[k]) !== JSON.stringify(before[k])) patch[k] = after[k];
  }
  return patch;
}
function deleteMemberDoc(id) {
  if (!db) return Promise.reject({ code: 'not_granted' });
  return queueWrite('m/' + id, () => db.collection('members').doc(id).delete());
}
function saveSettings(doc) {
  if (!db) return Promise.reject({ code: 'not_granted' });
  return queueWrite('settings', () => db.doc('config/settings').set(doc));
}
function writeErrText(e) {
  const c = e && e.code;
  if (c === 'quota_exceeded') return 'Kayıt alanı doldu. Eski üyeleri silerek yer açabilirsin.';
  if (c === 'local_failed') return 'Kaydedilemedi: tarayıcı bu bilgisayarda kayıt yapmaya izin vermiyor olabilir.';
  if (c === 'invalid_argument') return 'Kaydedilemedi: bu sayfada değişiklik yapma yetkin olmayabilir.';
  if (c === 'resource_exhausted') return 'Çok hızlı işlem yapıldı. Birkaç saniye sonra tekrar dene.';
  if (c === 'revoked' || c === 'not_granted' || c === 'capability_disabled' || c === 'capability_removed') return 'Veritabanına bağlı değil. Sayfayı claude.ai üzerinden yeniden aç.';
  return 'Kaydedilemedi. İnternet bağlantını kontrol edip tekrar dene.';
}
function applyLocal(id, data) {
  const arr = S.members.slice();
  const i = arr.findIndex(x => x.id === id);
  if (data) { const obj = Object.assign({ id }, data); if (i >= 0) arr[i] = obj; else arr.push(obj); }
  else if (i >= 0) arr.splice(i, 1);
  S.members = arr;
  S.byId = new Map(arr.map(x => [x.id, x]));
  onData();
}
async function mutateMember(id, fn) {
  const before = S.byId.get(id);
  if (!before) { toast('Üye bulunamadı.', 'bad'); return false; }
  const data = clone(before);
  delete data.id;
  if (fn(data) === false) return false;
  const patch = diffPatch(before, data);
  if (!Object.keys(patch).length) return true;
  data.updatedAt = patch.updatedAt = new Date().toISOString();
  applyLocal(id, data);
  try { await patchMember(id, patch); return true; }
  catch (e) {
    const old = clone(before); delete old.id; applyLocal(id, old);
    toast(writeErrText(e), 'bad');
    return false;
  }
}
async function removeMember(id) {
  const before = S.byId.get(id);
  applyLocal(id, null);
  try { await deleteMemberDoc(id); return true; }
  catch (e) {
    if (before) { const old = clone(before); delete old.id; applyLocal(id, old); }
    toast(writeErrText(e), 'bad');
    return false;
  }
}

function routeOf(h) {
  h = String(h || '').replace(/^#/, '');
  try { h = decodeURIComponent(h); } catch (e) { /* olduğu gibi */ }
  if (h.indexOf('uye-') === 0 && h.length > 4) return { view: 'uye', id: h.slice(4) };
  if (['ozet', 'uyeler', 'yeni-uye', 'ayarlar', 'turnike'].indexOf(h) >= 0) return { view: h, id: null };
  return { view: 'ozet', id: null };
}
function go(hash) {
  if (S.kiosk && hash !== 'turnike') return;
  setRoute(routeOf(hash));
  try { if (location.hash !== '#' + hash) location.hash = hash; } catch (e) { /* çerçeve izin vermeyebilir */ }
}
function setRoute(r) {
  if (S.kiosk && r.view !== 'turnike') return;
  const changed = r.view !== S.route.view || r.id !== S.route.id;
  S.route = r;
  if (r.view === 'turnike') { enterKiosk(); return; }
  if (changed) { S.formDirty = false; animateNext = true; }
  renderAll();
  if (changed) window.scrollTo(0, 0);
}
window.addEventListener('hashchange', () => {
  const r = routeOf(location.hash);
  if (S.kiosk && r.view !== 'turnike') { try { location.replace('#turnike'); } catch (e) { /* yok say */ } return; }
  if (r.view === S.route.view && r.id === S.route.id) return;
  setRoute(r);
});

    <span class="li-main"><span class="li-name">${esc(r.name)}${r.m.hasHealthIssue ? ' <span class="hflag">Sağlık</span>' : ''}</span>${sub ? `<span class="li-sub">${sub}</span>` : ''}</span>
    <span class="li-end">${end}</span></button></li>`;
}

/* ---------- Üyeler ---------- */
function viewMembers() {
  return `<header class="page-head"><div><h1>Üyeler</h1><p class="sub" id="rows-count"></p></div><a class="btn btn-primary" href="#yeni-uye">${ICON.plus}Yeni üye</a></header>
  <div class="toolbar">
    <label class="search" for="q"><span class="sr">Üye ara</span>${ICON.search}<input id="q" type="search" placeholder="Ad ya da telefon" value="${esc(S.q)}" autocomplete="off"></label>
    <label class="sort" for="sort">Sırala <select id="sort" data-change="sort">
      ${[['ad', 'Ada göre (A–Z)'], ['kalan', 'Kalan güne göre'], ['gelis', 'Son gelişe göre'], ['kayit', 'Yeni kayıtlar önce']].map(([k, l]) => `<option value="${k}" ${S.sort === k ? 'selected' : ''}>${l}</option>`).join('')}
    </select></label>
  </div>
  <div class="chips" role="group" aria-label="Filtre">${FILTERS.map(f => `<button type="button" class="chip ${S.filter === f.k ? 'on' : ''}" data-act="filter" data-f="${f.k}" aria-pressed="${S.filter === f.k}">${f.l} <span class="chip-n"></span></button>`).join('')}</div>
  <div id="rows" class="rows"></div>`;
}
function rankRemain(r) {
  const s = r.s;
  if (s.status === 'aktif' || s.status === 'donduruldu') return s.remaining;
  if (s.status === 'bitti') return 50000 + s.daysAgo;
  if (s.status === 'bekliyor') return 100000 + s.remaining;
  return 200000;
}
function sorter(k) {
  const byName = (a, b) => a.name.localeCompare(b.name, 'tr');
  if (k === 'kalan') return (a, b) => rankRemain(a) - rankRemain(b) || byName(a, b);
  if (k === 'gelis') return (a, b) => ((a.last || '') < (b.last || '') ? 1 : (a.last || '') > (b.last || '') ? -1 : byName(a, b));
  if (k === 'kayit') return (a, b) => String(b.m.createdAt || '').localeCompare(String(a.m.createdAt || '')) || byName(a, b);
  return byName;
}
function renderRows() {
  const host = $('#rows');
  if (!host) return;
  const rows = rowsData();
  const q = normText(S.q.trim());
  for (const f of FILTERS) {
    const chip = $(`.chip[data-f="${f.k}"]`);
    if (!chip) continue;
    const n = rows.filter(f.fn).length;
    chip.querySelector('.chip-n').textContent = n;
    chip.hidden = !!f.hideEmpty && n === 0 && S.filter !== f.k;
  }
  const F = FILTERS.find(f => f.k === S.filter) || FILTERS[0];
  let list = rows.filter(F.fn);
  if (q) list = list.filter(r => r.key.indexOf(q) >= 0);
  list.sort(sorter(S.sort));
  const cnt = $('#rows-count');
  if (cnt) cnt.textContent = rows.length ? (list.length === rows.length ? `${rows.length} üye` : `${rows.length} üyeden ${list.length} tanesi gösteriliyor`) : 'Henüz üye yok';
  host.innerHTML = list.length ? list.map(rowHTML).join('')
    : `<div class="empty">${rows.length ? 'Bu arama ya da filtreye uyan üye yok.' : 'Henüz üye yok. Sağ üstten yeni üye ekleyebilirsin.'}</div>`;
}
function rowHTML(r) {
  const s = r.s, t = S.today;
  let rem, frac = 0;
  if (s.status === 'aktif' || s.status === 'donduruldu') { rem = `<strong>${s.lastDayToday ? 'Son gün' : esc(remainText(s.remaining, t))}</strong><small>${s.status === 'donduruldu' ? 'kaldı · donduruldu' : 'kaldı'}</small>`; frac = s.total ? s.remaining / s.total : 0; }
  else if (s.status === 'bekliyor') { rem = `<strong>${fmtDM(s.focus.effStart)}</strong><small>başlıyor</small>`; frac = 1; }
  else if (s.status === 'bitti') rem = `<strong>${s.daysAgo} gün</strong><small>önce bitti</small>`;
  else rem = '<strong>—</strong><small>paket yok</small>';
  const pkg = s.focus ? `${s.focus.months} aylık paket · Son gün ${fmtDM(s.lastDay)}` : 'Paket tanımlı değil';
  return `<button type="button" class="row tone-${toneOf(s)}" data-act="open" data-id="${esc(r.m.id)}">
    <span class="avatar" aria-hidden="true">${esc(initials(r.m))}</span>
    <span class="row-main"><span class="row-name">${esc(r.name)}${r.m.hasHealthIssue ? '<span class="hflag">Sağlık</span>' : ''}${r.m.sample ? '<span class="tag-sample">Örnek</span>' : ''}</span><span class="row-meta">${pkg}</span></span>
    <span class="row-remain">${rem}<span class="bar"><span style="width:${Math.round(Math.max(0, Math.min(1, frac)) * 100)}%"></span></span></span>
    <span class="row-last"><small>Son geliş</small><strong>${r.lastDate ? esc(agoText(r.lastDate, t)) : '—'}</strong></span>
    <span class="row-pills">${statusPill(s)}${r.p.overdue.length ? '<span class="pill bad">Ödeme gecikti</span>' : ''}</span>
  </button>`;
}

/* ---------- Form parçaları ---------- */

  return `
  <section class="${wrap}">
    ${head}
    <div class="pkg-grid" role="radiogroup" aria-label="Paket süresi">
      ${PACKAGES.map(m => {
        const pr = Number(c.prices[m]);
        return `<label class="pkg" for="${px}pk${m}"><input id="${px}pk${m}" type="radio" name="months" value="${m}" ${m === months ? 'checked' : ''}><span class="pkg-n">${m}</span><span class="pkg-u">ay</span><span class="pkg-price">${pr > 0 ? fmtMoney(pr) : ''}</span><span class="pkg-tag ${canFreezePackage(m) ? 'ok' : ''}">${canFreezePackage(m) ? 'Dondurulabilir' : 'Dondurulamaz'}</span></label>`;
      }).join('')}
    </div>
    <div class="grid2">
      ${fld(px, 'start', 'Başlangıç tarihi', `<input id="${px}start" name="start" type="date" value="${esc(o.start)}" required>`)}
      <div class="preview" data-end-preview aria-live="polite"></div>
    </div>
  </section>`;
}
function payHTML(px, o, no) {
  const c = cfg();
  const months = o.months || 3;
  const p0 = Number(c.prices[months]);
  const priceVal = o.price != null ? fmtPlain(o.price) : p0 > 0 ? fmtPlain(p0) : '';
  const wrap = o.steps ? 'card form-sec' : 'msec';
  const head = o.steps ? `<h2><span class="step">${no}</span>Ödeme</h2>` : '<h3 class="sub-h">Ödeme</h3>';
  const opts = instCounts(months);
  return `
  <section class="${wrap}" data-pay>
    ${head}
    <div class="grid3">

      <fieldset class="field"><legend>Ödeme şekli</legend><div class="seg-opts">
        <label for="${px}pt1"><input id="${px}pt1" type="radio" name="payType" value="pesin" checked>Peşin</label>
        <label for="${px}pt2"><input id="${px}pt2" type="radio" name="payType" value="taksit" ${opts.length ? '' : 'disabled'}>Taksitli</label>
      </div></fieldset>
      ${fld(px, 'method', 'Ödeme yöntemi', `<select id="${px}method" name="method">${METHODS.map(([k, l]) => `<option value="${k}">${l}</option>`).join('')}</select>`)}
    </div>
    <p class="inst-note" data-inst-note>${esc(instRuleText(months))}</p>
    <div data-pesin><label class="check" for="${px}paidNow"><input id="${px}paidNow" type="checkbox" name="paidNow" checked> Ödeme alındı</label></div>
    <div data-taksit hidden class="stack">
      <div class="grid2 align-end">
        ${fld(px, 'count', 'Taksit sayısı', `<select id="${px}count" name="count">${opts.map(n => `<option value="${n}">${n} taksit</option>`).join('')}</select>`)}
        <label class="check" for="${px}firstPaid"><input id="${px}firstPaid" type="checkbox" name="firstPaid" checked> İlk taksit ödendi</label>
      </div>
      <div data-inst-preview></div>
    </div>
  </section>`;
}
/* Paket yenileme penceresinde paket ve ödeme yan yana kalır */
function pkgPayHTML(px, o) { return pkgHTML(px, o, 1) + payHTML(px, o, 2); }
/* Seçilen pakete göre taksit seçeneklerini günceller; 1 aylık pakette taksit kapanır */
/* Taksit sayısı listesinde her seçeneğin yanında taksit başına düşen tutar yazar: "3 taksit · 2.334 ₺" */
function labelInstOptions(form) {
  const E = form.elements;
  const price = parseNum(E['price'] ? E['price'].value : '');
  Array.from((E['count'] || {}).options || []).forEach(o => {
    const n = Number(o.value);
    o.textContent = n + ' taksit' + (Number.isFinite(price) && price > 0 ? ' · ' + fmtMoney(splitAmount(price, n)[n - 1]) : '');
  });
}
function syncInstOptions(form, months) {
  const E = form.elements;
  const opts = instCounts(months);
  const sel = E['count'];
  const cur = Number(sel.value);
  sel.innerHTML = opts.map(n => `<option value="${n}">${n} taksit</option>`).join('');
  if (opts.length) sel.value = String(opts.indexOf(cur) >= 0 ? cur : opts[0]);
  labelInstOptions(form);
  const pt1 = form.querySelector('[name="payType"][value="pesin"]');
  const pt2 = form.querySelector('[name="payType"][value="taksit"]');
  if (pt2) {
    pt2.disabled = !opts.length;
    const lab = pt2.closest('label');
    if (lab) lab.classList.toggle('off', !opts.length);
    if (!opts.length && pt2.checked && pt1) pt1.checked = true;
  }
  const note = form.querySelector('[data-inst-note]');
  if (note) note.textContent = months ? instRuleText(months) : '';
}
function updatePkgPay(form, src) {
  if (!form) return;
  const E = form.elements, c = cfg();
  const months = Number((form.querySelector('[name="months"]:checked') || {}).value || 0);
  if (src === 'init' || src === 'months') syncInstOptions(form, months);
  if (src === 'months') {
    const p = Number(c.prices[months]);
    if (!form.dataset.priceTouched && p > 0) E['price'].value = fmtPlain(p);
  }
  const start = E['start'].value;
  const prev = form.querySelector('[data-end-preview]');
  if (prev) {
    if (isYMD(start) && months) {
      const end = addMonths(start, months);
      prev.innerHTML = `<span>Son gün</span><strong>${fmtDate(addDays(end, -1))}</strong><span>${diffDays(start, end)} gün · ${canFreezePackage(months) ? 'dondurulabilir' : 'dondurulamaz'}</span>`;
    } else prev.innerHTML = '<span>Son gün</span><strong>—</strong>';
  }
  const type = (form.querySelector('[name="payType"]:checked') || {}).value;
  form.querySelector('[data-pesin]').hidden = type !== 'pesin';
  form.querySelector('[data-taksit]').hidden = type !== 'taksit';
  if (src === 'price' || src === 'months') labelInstOptions(form);
  if (type === 'taksit' && ['init', 'months', 'price', 'start', 'count', 'payType'].indexOf(src) >= 0) regenInst(form);
  if (type === 'taksit') updateInstTotal(form);
}
function regenInst(form) {
  const host = form.querySelector('[data-inst-preview]');
  if (!host) return;
  const E = form.elements;
  const px = (E['start'].id || '').replace(/start$/, '');
  const price = parseNum(E['price'].value);
  const count = Number(E['count'].value) || 0;
  if (!count) { host.innerHTML = ''; return; }
  const start = isYMD(E['start'].value) ? E['start'].value : S.today;
  const list = makeInstallments(Number.isFinite(price) && price > 0 ? price : 0, count, start);
  host.innerHTML = `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Taksit</th><th>Tutar (₺)</th><th>Vade</th></tr></thead><tbody>${list.map((it, i) =>
    `<tr><th scope="row">${i + 1}.</th><td><input id="${px}ia${i}" name="ia${i}" type="text" inputmode="decimal" value="${esc(fmtPlain(it.amount))}" aria-label="${i + 1}. taksit tutarı"></td><td><input id="${px}id${i}" name="id${i}" type="date" value="${it.due}" aria-label="${i + 1}. taksit vadesi"></td></tr>`).join('')}</tbody></table></div><p class="inst-total" data-inst-total></p>`;
}
function updateInstTotal(form) {
  const el = form.querySelector('[data-inst-total]');
  if (!el) return;
  const E = form.elements;
  const count = Number(E['count'].value) || 0;
  let sum = 0;
  for (let i = 0; i < count; i++) { const v = parseNum((E['ia' + i] || {}).value); if (Number.isFinite(v)) sum += v; }
  const price = parseNum(E['price'].value);
  const diff = round2((Number.isFinite(price) ? price : 0) - sum);
  el.innerHTML = `Taksit toplamı <strong>${fmtMoney(sum)}</strong>` + (Math.abs(diff) >= 0.01 ? ` <span class="t-warn">· ücretten ${fmtMoney(Math.abs(diff))} ${diff > 0 ? 'eksik' : 'fazla'}</span>` : '');
}
function readPkgPay(form, errs) {
  const E = form.elements;
  const months = Number((form.querySelector('[name="months"]:checked') || {}).value);
  const start = E['start'].value;
  const price = parseNum(E['price'].value);
  const payType = (form.querySelector('[name="payType"]:checked') || {}).value || 'pesin';
  const method = E['method'].value || 'nakit';
  const n0 = errs.length;
  if (PACKAGES.indexOf(months) < 0) errs.push('Paket seç.');
  if (!isYMD(start)) errs.push('Başlangıç tarihini seç.');
  if (price === null) errs.push('Ücreti yaz (ücretsizse 0 yaz).');
  else if (!Number.isFinite(price) || price < 0) errs.push('Ücret geçerli bir sayı olmalı.');
  if (errs.length > n0) return null;
  const paidDate = minYMD(start, S.today);
  let installments = [];
  if (payType === 'pesin') {
    const paid = E['paidNow'].checked;
    installments = [{ id: uid('t'), no: 1, amount: round2(price), due: start, paidAt: paid ? paidDate : null, method: paid ? method : null }];
  } else {
    const count = Number(E['count'].value) || 0;
    const allowed = instCounts(months);
    if (allowed.indexOf(count) < 0) { errs.push(instRuleText(months)); return null; }
    const firstPaid = E['firstPaid'].checked;
    let sum = 0;
    for (let i = 0; i < count; i++) {
      const a = parseNum((E['ia' + i] || {}).value);
      const d = (E['id' + i] || {}).value;
      if (a === null || !Number.isFinite(a) || a < 0) { errs.push(`${i + 1}. taksitin tutarı geçersiz.`); continue; }
      if (!isYMD(d)) { errs.push(`${i + 1}. taksitin vadesini seç.`); continue; }
      sum += a;
      const paid = i === 0 && firstPaid;
      installments.push({ id: uid('t'), no: i + 1, amount: round2(a), due: d, paidAt: paid ? paidDate : null, method: paid ? method : null });
    }
    if (errs.length === n0 && Math.abs(round2(sum) - round2(price)) >= 0.01) errs.push(`Taksitlerin toplamı (${fmtMoney(sum)}) ücrete (${fmtMoney(price)}) eşit olmalı.`);
  }
  if (errs.length > n0) return null;
  return { id: uid('p'), months, start, price: round2(price), payType, installments, freezes: [], createdAt: new Date().toISOString() };
}
